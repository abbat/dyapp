name: dyapp

x-runtime: &runtime
  image: dyapp:network-test
  user: "999:999"
  cpus: 1
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  read_only: true
  networks: [test-peers]
  # Test the current checkout and binaries, rather than a stale image snapshot.
  volumes:
    - ..:/workspace:ro
    - workspace-cache:/workspace/target:ro
  tmpfs:
    - /tmp:rw,exec,nosuid,nodev,mode=1777
    - /home/appuser:rw,nosuid,nodev,uid=999,gid=999,mode=0700

# The container address is announced as external, so Kademlia serves the DHT without fixed IPs.
x-peer: &peer
  <<: *runtime
  command:
    - bash
    - -c
    - >-
      bash scripts/check-container-isolation.sh
      && ip=$$(getent hosts "$$HOSTNAME" | cut -d " " -f 1)
      && export DYAPPD_EXTERNAL="[\"$$ip:7070\"]"
      && { test -e /tmp/node/node.key || target/debug/dyappd keygen; }
      && exec target/debug/dyappd
  environment: &env
    # The default listens on loopback only.
    DYAPPD_LISTEN: '["[::]:7070", "0.0.0.0:7070"]'
    DYAPPD_STORAGE_DIR: /tmp/node
    DYAPPD_ROLES: '["store", "search", "media"]'
    # A low node-ID proof of work keeps keygen fast; the network test sets the same.
    DYAPPD_NETWORK_ID_POW_BITS: "8"
    # Every test node shares one /16.
    DYAPPD_NETWORK_DISTINCT_OUTBOUND_GROUPS: "false"
    DYAPPD_NETWORK_GUARD_DIALS: "false"
    # Repair and ack forwarding run seconds after the nodes meet.
    DYAPPD_NETWORK_STORAGE_TRUST_MINUTES: "0"
  healthcheck:
    test: [CMD, python3, /workspace/scripts/network-test.py, --health, /ip4/127.0.0.1/tcp/7070]
    interval: 5s
    timeout: 20s
    retries: 12

services:
  # The TURN relay of bootstrap-a; network-test.py allocates on it with the node's credentials.
  turn:
    <<: *runtime
    command:
      - turnserver
      - --use-auth-secret
      - --static-auth-secret=network-test-secret
      - --realm=dyapp.test
      - --listening-port=3478
      - --no-tls
      - --no-dtls
      - --no-cli
      - --log-file=stdout
      - --pidfile=/tmp/turnserver.pid
      - --userdb=/tmp/turndb
  # Every replica holder serves media; only bootstrap-a serves TURN.
  bootstrap-a:
    <<: *peer
    environment:
      <<: *env
      DYAPPD_ROLES: '["store", "search", "media", "turn"]'
      DYAPPD_TURN_URLS: '["turn:turn:3478"]'
      DYAPPD_TURN_SECRET: network-test-secret
  bootstrap-b:
    <<: *peer
    environment:
      <<: *env
      DYAPPD_SEEDS: '["bootstrap-a:7070"]'
    # A node dials its seed once, at start.
    depends_on:
      bootstrap-a:
        condition: service_healthy
  # Allows network-test.py FLOOD_LIMIT requests per second per peer.
  bootstrap-c:
    <<: *peer
    environment:
      <<: *env
      DYAPPD_SEEDS: '["bootstrap-a:7070"]'
      DYAPPD_LIMITS_REQUESTS_PER_SECOND: "5"
    depends_on:
      bootstrap-a:
        condition: service_healthy
  network-test:
    <<: *runtime
    build:
      context: ..
      dockerfile: docker/Dockerfile.network-test
    depends_on:
      turn:
        condition: service_started
      bootstrap-a:
        condition: service_healthy
      bootstrap-b:
        condition: service_healthy
      bootstrap-c:
        condition: service_healthy
    volumes:
      - ..:/workspace:ro
      - workspace-cache:/workspace/target:ro
      - network-reports:/reports
    command: [bash, -c, "bash scripts/check-container-isolation.sh && exec python3 scripts/network-test.py"]

networks:
  test-peers:
    internal: true

volumes:
  workspace-cache:
    external: true
    name: dyapp_workspace-cache
  network-reports:
