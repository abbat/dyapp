name: dyapp

x-runtime: &runtime
  image: dyapp:network-test
  user: "999:999"
  cpus: 1
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  read_only: true
  networks: [test-peers]
  tmpfs:
    - /tmp:rw,exec,nosuid,nodev,mode=1777
    - /home/appuser:rw,nosuid,nodev,uid=999,gid=999,mode=0700

# The container address is announced as external, so Kademlia serves the DHT without fixed IPs.
x-peer: &peer
  <<: *runtime
  command:
    - bash
    - -c
    - >-
      bash scripts/check-container-isolation.sh
      && ip=$$(getent hosts "$$HOSTNAME" | cut -d " " -f 1)
      && export DYAPP_NODE__EXTERNAL="[\"/ip4/$$ip/tcp/7070\", \"/ip4/$$ip/udp/7070/quic-v1\"]"
      && exec target/debug/dyapp-node
  environment: &env
    DYAPP_NODE__STORAGE__DIR: /tmp/node
  healthcheck:
    test: [CMD, python3, /workspace/scripts/network-test.py, --health, /ip4/127.0.0.1/tcp/7070]
    interval: 5s
    timeout: 20s
    retries: 12

services:
  bootstrap-a:
    <<: *peer
  bootstrap-b:
    <<: *peer
    environment:
      <<: *env
      DYAPP_NODE__SEEDS: '["/dns4/bootstrap-a/tcp/7070"]'
    # A node dials its seed once, at start.
    depends_on:
      bootstrap-a:
        condition: service_healthy
  # Allows network-test.py FLOOD_LIMIT requests per second per peer.
  bootstrap-c:
    <<: *peer
    environment:
      <<: *env
      DYAPP_NODE__SEEDS: '["/dns4/bootstrap-a/tcp/7070"]'
      DYAPP_NODE__LIMITS__REQUESTS_PER_SECOND: "5"
    depends_on:
      bootstrap-a:
        condition: service_healthy
  network-test:
    <<: *runtime
    build:
      context: ..
      dockerfile: docker/Dockerfile.network-test
    depends_on:
      bootstrap-a:
        condition: service_healthy
      bootstrap-b:
        condition: service_healthy
      bootstrap-c:
        condition: service_healthy
    volumes:
      - network-reports:/reports
    command: [bash, -c, "bash scripts/check-container-isolation.sh && exec python3 scripts/network-test.py"]

networks:
  test-peers:
    internal: true

volumes:
  network-reports:
