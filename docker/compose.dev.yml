name: dyapp

x-build: &build
  context: ..
  dockerfile: docker/Dockerfile.dev

x-runtime: &runtime
  image: dyapp:dev-prepared
  user: "999:999"
  cpus: ${DYAPP_CPUS:-4}
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  network_mode: none
  read_only: true
  tmpfs:
    - /tmp:rw,exec,nosuid,nodev,mode=1777
    - /home/appuser:rw,nosuid,nodev,uid=999,gid=999,mode=0700
  volumes:
    - ..:/workspace:ro
    - workspace-cache:/workspace/target
  environment: &environment
    HOME: /home/appuser
    RUSTUP_TOOLCHAIN: "1.99.0"
    CARGO_NET_OFFLINE: "true"
    CARGO_INCREMENTAL: "0"
    CARGO_BUILD_JOBS: "${DYAPP_CPUS:-4}"
    CMAKE_BUILD_PARALLEL_LEVEL: "${DYAPP_CPUS:-4}"
    MAKEFLAGS: "-j${DYAPP_CPUS:-4}"
    RAYON_NUM_THREADS: "${DYAPP_CPUS:-4}"
    CXXFLAGS: "-g0"
    CARGO_PROFILE_DEV_DEBUG: "0"
    RUST_BACKTRACE: "1"
  working_dir: /workspace

services:
  dev:
    <<: *runtime
    build: *build
    entrypoint: &rust-command [bash, scripts/rust-command-in-container.sh]
    command: bash scripts/rust-check.sh test
    profiles: [test]
  build:
    <<: *runtime
    build: *build
    entrypoint: *rust-command
    command: bash scripts/rust-check.sh build
    profiles: [build]
  quality:
    <<: *runtime
    build: *build
    entrypoint: *rust-command
    command: bash scripts/rust-check.sh quality
    profiles: [quality]
  workflow-lint:
    <<: *runtime
    image: rhysd/actionlint@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667
    command: []
    profiles: [quality]
  coverage:
    <<: *runtime
    environment:
      <<: *environment
      COVERAGE_RUN_ID: ${COVERAGE_RUN_ID:-}
    build: *build
    entrypoint: *rust-command
    command: bash scripts/rust-check.sh coverage
    profiles: [coverage]
  security:
    <<: *runtime
    build: *build
    entrypoint: *rust-command
    command: bash scripts/rust-check.sh security
    profiles: [security]
  # The release binary on Debian 12, written to the host's target/deb as the calling user.
  deb:
    <<: *runtime
    image: dyapp:deb
    build:
      context: ..
      dockerfile: docker/Dockerfile.deb
    user: "${DYAPP_UID:-1000}:${DYAPP_GID:-1000}"
    tmpfs:
      - /tmp:rw,exec,nosuid,nodev,mode=1777
    volumes:
      - ..:/workspace:ro
      - ../target/deb:/workspace/target
    environment:
      <<: *environment
      HOME: /tmp
    entrypoint: *rust-command
    command: bash scripts/build-deb.sh
    profiles: [deb]
  # A clean Debian 12 as root: dpkg needs to create the user and chown.
  deb-test:
    image: debian:bookworm-slim
    cpus: ${DYAPP_CPUS:-4}
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, SETUID, SETGID, KILL]
    security_opt: [no-new-privileges:true]
    network_mode: none
    volumes:
      - ../target/deb:/deb:ro
      - ../scripts/deb-test.sh:/deb-test.sh:ro
    command: [bash, /deb-test.sh]
    profiles: [deb]

volumes:
  workspace-cache:
