name: python

on:
  push:
    paths:
      - '**.py'
      - '.flake8'
      - '.github/workflows/python-lint.yml'
  pull_request:
    paths:
      - '**.py'
      - '.flake8'

jobs:
  flake8:
    runs-on: ubuntu-latest
    name: flake8

    steps:
      - name: checkout
        uses: actions/checkout@v7

      - name: install python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: install flake8
        run: pip install flake8

      - name: run
        run: flake8 .
        continue-on-error: false
