name: python

on:
  push:
    paths:
      - '**.py'
      - '**.pyi'
      - '.mypy.ini'
      - 'tools/python-types/**'
      - '.flake8'
      - '.ruff.toml'
      - 'tests/scripts/rust-check.sh'
      - 'tools/scripts/check-output.json'
      - '.github/requirements-lint.txt'
      - '.github/workflows/python-lint.yml'
  pull_request:

permissions:
  contents: read

jobs:
  flake8:
    runs-on: ubuntu-latest
    name: flake8

    steps:
      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: install python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'

      - name: install flake8
        run: pip install --require-hashes --no-deps -r .github/requirements-lint.txt

      - name: install pinned formatter
        run: python3 -B tools/build-scripts/install-ruff.py "$pythonLocation/bin/ruff"

      - name: install pinned type checker
        run: |
          python_types="$RUNNER_TEMP/dyapp-python-types"
          python3 -B tools/build-scripts/install-mypy.py "$python_types"
          echo "DYAPP_PYTHON_TYPES=$python_types" >> "$GITHUB_ENV"

      - name: run
        run: bash tests/scripts/rust-check.sh python-check
        continue-on-error: false

      - name: check logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: python-check-output
          path: build/check-output/
          if-no-files-found: ignore
