name: python

on:
  push:
    paths:
      - '**.py'
      - '.flake8'
      - '.github/requirements-lint.txt'
      - '.github/workflows/python-lint.yml'
  pull_request:

permissions:
  contents: read

jobs:
  flake8:
    runs-on: ubuntu-latest
    name: flake8

    steps:
      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: install python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'

      - name: install flake8
        run: pip install --require-hashes --no-deps -r .github/requirements-lint.txt

      - name: run
        run: python3 tools/scripts/run-check.py --log-dir build/check-output flake8 -- flake8 .
        continue-on-error: false

      - name: check logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: python-check-output
          path: build/check-output/
          if-no-files-found: ignore
