name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

# A newer push makes the older run's answer useless; a tag or a manual run has a group of its own.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  DYAPP_CHECK_LOG_DIR: build/platform-check-output

jobs:
  core:
    uses: ./.github/workflows/ci-base.yml
  # Android runs in Docker: the image carries the SDK and system image, the app builds from the
  # checkout into build/android-build.
  docker:
    name: docker - android
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      DYAPP_BUILD_CACHE: gha
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # buildx keeps its own copy of each image before --load: free ~25 GB of
      # preinstalled SDKs the runner never uses here.
      - name: free disk
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: crazy-max/ghaction-github-runtime@04d248b84655b509d8c44dc1d6f990c879747487 # v4.0.0
      - name: kvm
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      # Downloaded dependencies only: build outputs would grow the cache past its 10 GB limit.
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: android-cache
        with:
          path: |
            build/android-build/gradle-home/caches/modules-2
            build/android-build/gradle-home/wrapper
            build/android-build/cargo-home/registry
          key: android-deps-${{ hashFiles('Cargo.lock', 'clients/android/**/*.gradle', 'clients/android/gradle/**') }}
          restore-keys: android-deps-
      - name: test
        env:
          DYAPP_KVM: "1"
        run: |
          python3 tools/scripts/docker-local.py -f tests/docker/compose.ui.yml --profile all build android-build
          bash tests/scripts/ui-test.sh android
          bash tests/scripts/ui-test.sh android-emulator
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: ${{ !cancelled() && github.ref == 'refs/heads/main' && steps.android-cache.outputs.cache-hit != 'true' }}
        with:
          path: |
            build/android-build/gradle-home/caches/modules-2
            build/android-build/gradle-home/wrapper
            build/android-build/cargo-home/registry
          key: ${{ steps.android-cache.outputs.cache-primary-key }}
      - name: logs
        if: always()
        run: |
          evidence_status=0
          python3 tools/scripts/run-check.py --log-dir build/platform-check-output docker -- docker compose -f tests/docker/compose.ui.yml --profile all logs || evidence_status=$?
          python3 tests/scripts/export-ui-reports.py || {
            copy_status=$?
            if (( evidence_status == 0 )); then evidence_status=$copy_status; fi
          }
          exit "$evidence_status"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: android-check-output
          path: |
            build/platform-check-output/
            build/platform-reports/
            build/android-build/android/app/reports/lint-results-*
          if-no-files-found: error

  linux:
    name: native - linux
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # compare complexity allowances with the delivery base
      - name: setup
        run: bash tools/scripts/ci-setup.sh linux
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: ". -> build"
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: test
        env:
          COMPLEXITY_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: bash tests/scripts/linux-test.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: linux-check-output
          path: |
            build/platform-check-output/
            build/complexity/linux/*/clippy.stderr
            build/complexity/linux/*/clippy.jsonl
            build/complexity/linux/*/report.json
          if-no-files-found: error

  apple:
    name: native - ${{ matrix.platform }}
    runs-on: macos-15
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ios
            targets: aarch64-apple-ios,aarch64-apple-ios-sim,x86_64-apple-ios
          - platform: macos
            targets: aarch64-apple-darwin,x86_64-apple-darwin
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: '1.99.0'
          targets: ${{ matrix.targets }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          # The workspace target dir is build/ (.cargo/config.toml), not target/.
          workspaces: ". -> build"
          key: ${{ matrix.platform }}
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: build core
        if: matrix.platform == 'ios'
        run: bash tools/scripts/build-apple-core.sh "${{ matrix.platform }}"
      - name: prepare xcode
        if: matrix.platform == 'ios'
        run: |
          curl -fL https://github.com/yonaskolb/XcodeGen/releases/download/2.46.0/xcodegen.zip -o "$RUNNER_TEMP/xcodegen.zip"
          echo "4d9e34b62172d645eed6457cac13fc222569974098ef4ee9c3368bedf0196806  $RUNNER_TEMP/xcodegen.zip" | shasum -a 256 -c
          unzip -q "$RUNNER_TEMP/xcodegen.zip" -d "$RUNNER_TEMP/xcodegen"
          "$RUNNER_TEMP/xcodegen/xcodegen/bin/xcodegen" generate --spec "clients/${{ matrix.platform }}/project.yml" --project "clients/${{ matrix.platform }}"
      - name: test
        if: matrix.platform == 'ios'
        env:
          APP_PLATFORM: ${{ matrix.platform }}
        run: bash tests/scripts/apple-test-in-ci.sh
      - name: Tauri macOS tests
        if: matrix.platform == 'macos'
        env:
          DYAPP_TEST_KEYCHAIN: '1'
          MACOSX_DEPLOYMENT_TARGET: '12.0'
          DYAPP_AXE: ${{ runner.temp }}/axe-core/axe.min.js
        run: |
          mkdir -p "$RUNNER_TEMP/axe-core" "$RUNNER_TEMP/apple-results"
          curl -fL https://registry.npmjs.org/axe-core/-/axe-core-4.14.0.tgz -o "$RUNNER_TEMP/axe.tgz"
          echo "2277b0a3ef47af9b52497faa3e71598e86e0a0e5e6eb295207a5657ede4709af  $RUNNER_TEMP/axe.tgz" | shasum -a 256 -c
          tar -xzf "$RUNNER_TEMP/axe.tgz" -C "$RUNNER_TEMP/axe-core" --strip-components=1 package/axe.min.js
          python3 tools/scripts/run-check.py --log-dir build/platform-check-output rust-test -- cargo test --manifest-path clients/macos/Cargo.toml --features ui-smoke --locked
          python3 tools/scripts/run-check.py --log-dir build/platform-check-output macos-build -- python3 tools/scripts/build-macos-client.py --profile debug --features ui-smoke --output "$RUNNER_TEMP/apple-results/DYApp.app" --log-dir "$RUNNER_TEMP/apple-results"
          python3 tests/scripts/desktop-smoke.py "$RUNNER_TEMP/apple-results/DYApp.app/Contents/MacOS/dyapp-macos"
      # Only on `gh run rerun --debug`. A separate step, since a job that hits its time limit skips the test script's cleanup.
      - name: window diagnostics
        if: ${{ always() && runner.debug == '1' && matrix.platform == 'macos' }}
        timeout-minutes: 3
        run: |
          out="$RUNNER_TEMP/apple-results/window-diagnostics"
          mkdir -p "$out"
          ls -laR "$HOME/Library/Saved Application State/com.dyapp.macos.savedState" > "$out/saved-state.txt" 2>&1 || true
          defaults read com.dyapp.macos > "$out/defaults.txt" 2>&1 || true
          log show --last 70m --style compact --predicate 'process == "DYApp" AND (eventMessage CONTAINS[c] "window" OR eventMessage CONTAINS[c] "restor" OR eventMessage CONTAINS[c] "persist")' > "$out/app-log.txt" 2>&1 || true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: apple-${{ matrix.platform }}
          path: |
            build/platform-check-output/
            ${{ runner.temp }}/apple-results/
            ${{ runner.temp }}/desktop-ui-results.json
          if-no-files-found: error

  windows:
    name: native - windows
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: prepare axe-core
        shell: pwsh
        run: |
          $archive = Join-Path $env:RUNNER_TEMP 'axe.tgz'
          $directory = Join-Path $env:RUNNER_TEMP 'axe-core'
          Invoke-WebRequest 'https://registry.npmjs.org/axe-core/-/axe-core-4.14.0.tgz' -OutFile $archive
          if ((Get-FileHash $archive -Algorithm SHA256).Hash.ToLowerInvariant() -ne '2277b0a3ef47af9b52497faa3e71598e86e0a0e5e6eb295207a5657ede4709af') { throw 'axe-core checksum mismatch' }
          New-Item -ItemType Directory -Force $directory | Out-Null
          tar -xzf $archive -C $directory --strip-components=1 package/axe.min.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "DYAPP_AXE=$directory/axe.min.js" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: '1.99.0'
      - name: build and unit tests
        shell: pwsh
        run: |
          python tools/scripts/run-check.py --log-dir build/platform-check-output rust-build -- cargo build --manifest-path clients/windows/Cargo.toml --features ui-smoke --locked
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $env:DYAPP_TEST_CREDENTIAL_MANAGER = '1'
          python tools/scripts/run-check.py --log-dir build/platform-check-output rust-test -- cargo test --manifest-path clients/windows/Cargo.toml --features ui-smoke --locked
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: smoke
        shell: pwsh
        run: |
          python tests/scripts/check-windows-icon.py build/debug/dyapp-windows.exe clients/windows/icons/icon.ico
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tests/scripts/desktop-smoke.py build/debug/dyapp-windows.exe
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: windows-app-and-ui
          path: |
            build/platform-check-output/
            build/debug/dyapp-windows.exe
            ${{ runner.temp }}/desktop-ui-results.json
          if-no-files-found: error

  summary:
    name: required
    runs-on: ubuntu-24.04
    needs: [core, docker, linux, apple, windows]
    if: always()
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: check
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          python3 tests/scripts/check-ci-results.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: summary-check-output
          path: build/platform-check-output/
          if-no-files-found: error
