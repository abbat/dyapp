name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  DYAPP_CHECK_LOG_DIR: build/platform-check-output

jobs:
  core:
    uses: ./.github/workflows/ci-base.yml
  # Android runs in Docker: the image carries the SDK, system image and Gradle cache.
  docker:
    name: docker - android
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      DYAPP_BUILD_CACHE: gha
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # buildx keeps its own copy of each image before --load: free ~25 GB of
      # preinstalled SDKs the runner never uses here.
      - name: free disk
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: crazy-max/ghaction-github-runtime@04d248b84655b509d8c44dc1d6f990c879747487 # v4.0.0
      - name: kvm
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: test
        env:
          DYAPP_KVM: "1"
        run: |
          python3 tools/scripts/docker-local.py -f tests/docker/compose.ui.yml --profile all build android-unit-test
          bash tests/scripts/ui-test.sh android
          bash tests/scripts/ui-test.sh android-emulator
      - name: logs
        if: always()
        run: |
          evidence_status=0
          python3 tools/scripts/run-check.py --log-dir build/platform-check-output docker -- docker compose -f tests/docker/compose.ui.yml --profile all logs || evidence_status=$?
          python3 tests/scripts/export-ui-reports.py || {
            copy_status=$?
            if (( evidence_status == 0 )); then evidence_status=$copy_status; fi
          }
          exit "$evidence_status"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: android-check-output
          path: |
            build/platform-check-output/
            build/platform-reports/
          if-no-files-found: error

  linux:
    name: native - linux
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: setup
        run: bash tools/scripts/ci-setup.sh linux
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: ". -> build"
      - name: test
        run: bash tests/scripts/linux-test.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: linux-check-output
          path: build/platform-check-output/
          if-no-files-found: error

  apple:
    name: native - ${{ matrix.platform }}
    runs-on: macos-15
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ios
            targets: aarch64-apple-ios,aarch64-apple-ios-sim,x86_64-apple-ios
          - platform: macos
            targets: aarch64-apple-darwin,x86_64-apple-darwin
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: '1.99.0'
          targets: ${{ matrix.targets }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: ${{ matrix.platform }}
      - name: build core
        run: bash tools/scripts/build-apple-core.sh "${{ matrix.platform }}"
      - name: prepare xcode
        run: |
          curl -fL https://github.com/yonaskolb/XcodeGen/releases/download/2.46.0/xcodegen.zip -o "$RUNNER_TEMP/xcodegen.zip"
          unzip -q "$RUNNER_TEMP/xcodegen.zip" -d "$RUNNER_TEMP/xcodegen"
          "$RUNNER_TEMP/xcodegen/xcodegen/bin/xcodegen" generate --spec "clients/${{ matrix.platform }}/project.yml" --project "clients/${{ matrix.platform }}"
      - name: test
        env:
          APP_PLATFORM: ${{ matrix.platform }}
        run: bash tests/scripts/apple-test-in-ci.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: apple-${{ matrix.platform }}
          path: |
            build/platform-check-output/
            ${{ runner.temp }}/apple-results/
          if-no-files-found: error

  windows:
    name: native - windows
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: '1.99.0'
      - name: build and unit tests
        shell: pwsh
        run: |
          python tools/scripts/run-check.py --log-dir build/platform-check-output rust-build -- cargo build --manifest-path clients/windows/Cargo.toml --locked
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/scripts/run-check.py --log-dir build/platform-check-output rust-test -- cargo test --manifest-path clients/windows/Cargo.toml --locked
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: smoke
        shell: pwsh
        run: python tests/scripts/desktop-smoke.py build/debug/dyapp-windows.exe
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: windows-app-and-ui
          path: |
            build/platform-check-output/
            build/debug/dyapp-windows.exe
            ${{ runner.temp }}/desktop-ui-results.json
          if-no-files-found: error

  summary:
    name: required
    runs-on: ubuntu-24.04
    needs: [core, docker, linux, apple, windows]
    if: always()
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: check
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          python3 tests/scripts/check-ci-results.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: summary-check-output
          path: build/platform-check-output/
          if-no-files-found: error
