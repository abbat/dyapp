name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  core:
    uses: ./.github/workflows/ci-base.yml
  # Android keeps Docker for now: the image carries the SDK, system image and Gradle cache.
  docker:
    name: docker - android
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      DYAPP_BUILD_CACHE: gha
    steps:
      - uses: actions/checkout@v7
      # buildx keeps its own copy of each image before --load: free ~25 GB of
      # preinstalled SDKs the runner never uses here.
      - name: free disk
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache
      - uses: docker/setup-buildx-action@v4
      - uses: crazy-max/ghaction-github-runtime@v4
      - name: kvm
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: test
        env:
          DYAPP_KVM: "1"
        run: |
          python3 scripts/docker-local.py -f docker/compose.ui.yml --profile all build android-unit-test
          bash scripts/ui-test.sh android
          bash scripts/ui-test.sh android-emulator
      - name: logs
        if: always()
        run: docker compose -f docker/compose.ui.yml --profile all logs

  linux:
    name: native - linux
    # webkit2gtk-4.0 (wry/tao) is not packaged for Ubuntu 24.04.
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - name: setup
        run: bash scripts/ci-setup.sh linux
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "linux -> target"
      - name: test
        run: bash scripts/linux-test.sh

  apple:
    name: native - ${{ matrix.platform }}
    runs-on: macos-15
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        platform: [ios, macos]
    steps:
      - uses: actions/checkout@v7
      - name: prepare xcode
        run: |
          curl -fL https://github.com/yonaskolb/XcodeGen/releases/download/2.44.1/xcodegen.zip -o "$RUNNER_TEMP/xcodegen.zip"
          unzip -q "$RUNNER_TEMP/xcodegen.zip" -d "$RUNNER_TEMP/xcodegen"
          "$RUNNER_TEMP/xcodegen/xcodegen/bin/xcodegen" generate --spec "${{ matrix.platform }}/project.yml" --project "${{ matrix.platform }}"
      - name: test
        env:
          APP_PLATFORM: ${{ matrix.platform }}
        run: bash scripts/apple-test-in-ci.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: apple-${{ matrix.platform }}
          path: |
            ${{ runner.temp }}/apple-results/
          if-no-files-found: error

  windows:
    name: native - windows
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.99.0'
      - name: build and unit tests
        shell: pwsh
        run: |
          cargo build --manifest-path windows/Cargo.toml --locked
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --manifest-path windows/Cargo.toml --locked
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: smoke
        shell: pwsh
        run: python scripts/desktop-smoke.py windows/target/debug/dyapp-windows.exe
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: windows-app-and-ui
          path: |
            windows/target/debug/dyapp-windows.exe
            ${{ runner.temp }}/desktop-ui-results.json
          if-no-files-found: error

  summary:
    name: required
    runs-on: ubuntu-24.04
    needs: [core, docker, linux, apple, windows]
    if: always()
    steps:
      - name: check
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          python3 -c 'import json,os,sys; results=json.loads(os.environ["RESULTS"]); print(results); sys.exit(any(v["result"] != "success" for v in results.values()))'
