name: ci

on:
  push:
    branches: [main]
    tags: ['**']
  pull_request:
  workflow_dispatch:

# A newer push makes the older run's answer useless; a tag or a manual run has a group of its own.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  DYAPP_CHECK_LOG_DIR: build/platform-check-output

jobs:
  core:
    uses: ./.github/workflows/ci-base.yml
  # Build once, then run the two independent emulator lanes on separate runners.
  docker:
    name: docker - android
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      DYAPP_BUILD_CACHE: gha
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # buildx keeps its own copy of each image before --load: free ~25 GB of
      # preinstalled SDKs the runner never uses here.
      - name: free disk
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: crazy-max/ghaction-github-runtime@04d248b84655b509d8c44dc1d6f990c879747487 # v4.0.0
      # Downloaded dependencies only: build outputs would grow the cache past its 10 GB limit.
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: android-cache
        with:
          path: |
            build/android-build/gradle-home/caches/modules-2
            build/android-build/gradle-home/wrapper
            build/android-build/cargo-home/registry
          key: android-deps-${{ hashFiles('Cargo.lock', 'clients/android/**/*.gradle', 'clients/android/gradle/**') }}
          restore-keys: android-deps-
      - name: build and unit
        run: |
          python3 tools/scripts/docker-local.py -f tests/docker/compose.ui.yml --profile all build android-build
          mkdir -p build/android-reports/build-provenance
          git rev-parse HEAD > build/android-reports/build-provenance/source-head.txt
          docker image inspect --format '{{.Id}}' dyapp:android-tools > build/android-reports/build-provenance/android-tools-image.txt
          bash tests/scripts/ui-test.sh android
      # Save dependencies before an emulator lane can time out.
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: ${{ !cancelled() && github.ref == 'refs/heads/main' && steps.android-cache.outputs.cache-hit != 'true' }}
        with:
          path: |
            build/android-build/gradle-home/caches/modules-2
            build/android-build/gradle-home/wrapper
            build/android-build/cargo-home/registry
          key: ${{ steps.android-cache.outputs.cache-primary-key }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-runtime-packages
          path: |
            build/android-build/android/lifecycle/app-base.apk
            build/android-build/android/lifecycle/app-upgrade.apk
            build/android-build/android/app/outputs/apk/androidTest/debug/app-debug-androidTest.apk
            build/android-build/debug/dyappd
            build/android-build/debug/examples/android_photo_fixture
          if-no-files-found: error
      - name: logs
        if: always()
        run: |
          set -o pipefail
          evidence_status=0
          mkdir -p build/android-reports/build-provenance
          ps -eo pid,ppid,stat,etime,args > build/android-reports/build-provenance/processes.txt || true
          docker ps -a --no-trunc > build/android-reports/build-provenance/containers.txt || true
          docker ps -aq --filter label=com.docker.compose.project=dyapp |
            xargs -r docker inspect > build/android-reports/build-provenance/container-state.json || true
          docker ps -aq --filter label=com.docker.compose.project=dyapp |
            xargs -r -n1 docker top > build/android-reports/build-provenance/container-processes.txt 2>&1 || true
          docker ps -aq --filter label=com.docker.compose.project=dyapp |
            xargs -r docker inspect --format '{{.Config.Hostname}} {{.Image}} {{index .Config.Labels "com.docker.compose.service"}}' \
            > build/android-reports/build-provenance/container-images.txt || evidence_status=$?
          docker ps -aq --filter label=com.docker.compose.project=dyapp --filter label=com.docker.compose.oneoff=True |
            xargs -r -n1 docker logs > build/android-reports/build-provenance/one-off-container-logs.txt 2>&1 || true
          python3 tools/scripts/run-check.py --log-dir build/platform-check-output docker -- docker compose -f tests/docker/compose.ui.yml --profile all logs || evidence_status=$?
          python3 tests/scripts/export-ui-reports.py || {
            copy_status=$?
            if (( evidence_status == 0 )); then evidence_status=$copy_status; fi
          }
          exit "$evidence_status"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: android-build-check-output
          path: |
            build/platform-check-output/
            build/platform-reports/
            build/android-reports/build-provenance/
            build/android-build/android/app/reports/lint-results-*
          if-no-files-found: error

  # Default job-id naming also stays readable when GitHub skips the matrix before expansion.
  docker-emulators:
    name: docker - ${{ matrix.lane }}
    needs: docker
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      DYAPP_BUILD_CACHE: gha
    strategy:
      fail-fast: false
      matrix:
        include:
          - lane: android-emulator
            emulator_service: android-emulator
            image_service: android-build
            image: dyapp:android-tools
            artifact: android-check-output
            phase: primary
            budget: 30
          - lane: android-lifecycle
            emulator_service: android-emulator
            image_service: android-build
            image: dyapp:android-tools
            artifact: android-lifecycle-check-output
            phase: lifecycle
            budget: 30
          - lane: android-permissions
            emulator_service: android-permission-emulator
            image_service: android-permission-emulator
            image: dyapp:android-permission-tools
            artifact: android-permission-check-output
            budget: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: free disk
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: crazy-max/ghaction-github-runtime@04d248b84655b509d8c44dc1d6f990c879747487 # v4.0.0
      - name: kvm
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: android-runtime-packages
          path: build/android-build
      - name: prepare runtime
        run: |
          chmod +x build/android-build/debug/dyappd build/android-build/debug/examples/android_photo_fixture
          python3 tools/scripts/docker-local.py -f tests/docker/compose.ui.yml --profile all build ${{ matrix.image_service }}
          mkdir -p build/android-reports/build-provenance
          git rev-parse HEAD > build/android-reports/build-provenance/source-head.txt
          docker image inspect --format '{{.Id}}' ${{ matrix.image }} > build/android-reports/build-provenance/android-tools-image.txt
      - name: emulator readiness
        timeout-minutes: 15
        env:
          EMULATOR_SERVICE: ${{ matrix.emulator_service }}
        run: |
          DYAPP_KVM_GID=$(stat -c %g /dev/kvm)
          export DYAPP_KVM_GID
          python3 tools/scripts/docker-local.py -f tests/docker/compose.ui.yml \
            -f tests/docker/compose.kvm.yml --profile all \
            up --no-build --pull never --wait "$EMULATOR_SERVICE"
      - name: test
        env:
          DYAPP_KVM: "1"
          DYAPP_ANDROID_SKIP_BUILD: "1"
          DYAPP_ANDROID_UI_PHASE: ${{ matrix.phase }}
        run: |
          timeout --kill-after=30s "${{ matrix.budget }}m" bash tests/scripts/ui-test.sh ${{ matrix.lane }}
      - name: logs
        if: always()
        run: |
          set -o pipefail
          evidence_status=0
          mkdir -p build/android-reports/build-provenance
          ps -eo pid,ppid,stat,etime,args > build/android-reports/build-provenance/processes.txt || true
          docker ps -a --no-trunc > build/android-reports/build-provenance/containers.txt || true
          docker ps -aq --filter label=com.docker.compose.project=dyapp |
            xargs -r docker inspect > build/android-reports/build-provenance/container-state.json || true
          docker ps -aq --filter label=com.docker.compose.project=dyapp |
            xargs -r -n1 docker top > build/android-reports/build-provenance/container-processes.txt 2>&1 || true
          docker ps -aq --filter label=com.docker.compose.project=dyapp |
            xargs -r docker inspect --format '{{.Config.Hostname}} {{.Image}} {{index .Config.Labels "com.docker.compose.service"}}' \
            > build/android-reports/build-provenance/container-images.txt || evidence_status=$?
          docker ps -aq --filter label=com.docker.compose.project=dyapp --filter label=com.docker.compose.oneoff=True |
            xargs -r -n1 docker logs > build/android-reports/build-provenance/one-off-container-logs.txt 2>&1 || true
          python3 tools/scripts/run-check.py --log-dir build/platform-check-output docker -- docker compose -f tests/docker/compose.ui.yml --profile all logs || evidence_status=$?
          python3 tests/scripts/export-ui-reports.py || {
            copy_status=$?
            if (( evidence_status == 0 )); then evidence_status=$copy_status; fi
          }
          exit "$evidence_status"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: ${{ matrix.artifact }}
          path: |
            build/platform-check-output/
            build/platform-reports/
            build/android-permission-reports/
            build/android-reports/build-provenance/
          if-no-files-found: error

  linux:
    name: native - linux
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # compare complexity allowances with the delivery base
      - name: setup
        run: bash tools/scripts/ci-setup.sh linux
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: ". -> build"
          # Tagged artifacts must not consume mutable CI build caches.
          lookup-only: ${{ startsWith(github.ref, 'refs/tags/') }}
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: test
        env:
          COMPLEXITY_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          DYAPP_UI_SHOTS: ${{ runner.temp }}/linux-smoke-shots
        run: |
          mkdir -p "$DYAPP_UI_SHOTS"
          bash tests/scripts/linux-test.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: linux-check-output
          path: |
            ${{ runner.temp }}/linux-smoke-shots/
            build/platform-check-output/
            ${{ runner.temp }}/desktop-ui-results.json
            ${{ runner.temp }}/moderation-shots-*/
            ${{ runner.temp }}/received-views-shots-*/
            ${{ runner.temp }}/link-review-shots-*/
            ${{ runner.temp }}/publication-shots-*/
            build/complexity/linux/*/clippy.stderr
            build/complexity/linux/*/clippy.jsonl
            build/complexity/linux/*/report.json
          if-no-files-found: error

  apple:
    name: native - ${{ matrix.platform }}
    runs-on: macos-15
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ios
            targets: aarch64-apple-ios,aarch64-apple-ios-sim,x86_64-apple-ios
          - platform: macos
            targets: aarch64-apple-darwin,x86_64-apple-darwin
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: '1.99.0'
          targets: ${{ matrix.targets }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          # The workspace target dir is build/ (.cargo/config.toml), not target/.
          workspaces: ". -> build"
          key: ${{ matrix.platform }}
          # Keep PR/main acceleration, but build tagged artifacts without cached state.
          lookup-only: ${{ startsWith(github.ref, 'refs/tags/') }}
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: build core
        if: matrix.platform == 'ios'
        run: bash tools/scripts/build-apple-core.sh "${{ matrix.platform }}"
      - name: prepare xcode
        if: matrix.platform == 'ios'
        run: |
          curl -fL https://github.com/yonaskolb/XcodeGen/releases/download/2.46.0/xcodegen.zip -o "$RUNNER_TEMP/xcodegen.zip"
          echo "4d9e34b62172d645eed6457cac13fc222569974098ef4ee9c3368bedf0196806  $RUNNER_TEMP/xcodegen.zip" | shasum -a 256 -c
          unzip -q "$RUNNER_TEMP/xcodegen.zip" -d "$RUNNER_TEMP/xcodegen"
          "$RUNNER_TEMP/xcodegen/xcodegen/bin/xcodegen" generate --spec "clients/${{ matrix.platform }}/project.yml" --project "clients/${{ matrix.platform }}"
      - name: test
        if: matrix.platform == 'ios'
        env:
          APP_PLATFORM: ${{ matrix.platform }}
        run: bash tests/scripts/apple-test-in-ci.sh
      - name: Tauri macOS tests
        if: matrix.platform == 'macos'
        env:
          DYAPP_TEST_KEYCHAIN: '1'
          MACOSX_DEPLOYMENT_TARGET: '12.0'
          DYAPP_AXE: ${{ runner.temp }}/axe-core/axe.min.js
        run: |
          mkdir -p "$RUNNER_TEMP/axe-core" "$RUNNER_TEMP/apple-results"
          curl -fL https://registry.npmjs.org/axe-core/-/axe-core-4.14.0.tgz -o "$RUNNER_TEMP/axe.tgz"
          echo "2277b0a3ef47af9b52497faa3e71598e86e0a0e5e6eb295207a5657ede4709af  $RUNNER_TEMP/axe.tgz" | shasum -a 256 -c
          tar -xzf "$RUNNER_TEMP/axe.tgz" -C "$RUNNER_TEMP/axe-core" --strip-components=1 package/axe.min.js
          python3 tools/scripts/run-check.py --log-dir build/platform-check-output rust-test -- cargo test --manifest-path clients/macos/Cargo.toml --features ui-smoke --locked
          python3 tools/scripts/run-check.py --log-dir build/platform-check-output macos-build -- python3 tools/scripts/build-macos-client.py --profile debug --features ui-smoke --output "$RUNNER_TEMP/apple-results/DYApp.app" --log-dir "$RUNNER_TEMP/apple-results"
          python3 tests/scripts/desktop-smoke.py "$RUNNER_TEMP/apple-results/DYApp.app/Contents/MacOS/dyapp-macos"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ always() && matrix.platform == 'ios' }}
        with:
          name: ios-screen-evidence
          path: ${{ runner.temp }}/apple-results/attachments/
      # Only on `gh run rerun --debug`. A separate step, since a job that hits its time limit skips the test script's cleanup.
      - name: window diagnostics
        if: ${{ always() && runner.debug == '1' && matrix.platform == 'macos' }}
        timeout-minutes: 3
        run: |
          out="$RUNNER_TEMP/apple-results/window-diagnostics"
          mkdir -p "$out"
          ls -laR "$HOME/Library/Saved Application State/com.dyapp.macos.savedState" > "$out/saved-state.txt" 2>&1 || true
          defaults read com.dyapp.macos > "$out/defaults.txt" 2>&1 || true
          log show --last 70m --style compact --predicate 'process == "DYApp" AND (eventMessage CONTAINS[c] "window" OR eventMessage CONTAINS[c] "restor" OR eventMessage CONTAINS[c] "persist")' > "$out/app-log.txt" 2>&1 || true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: apple-${{ matrix.platform }}
          path: |
            build/platform-check-output/
            ${{ runner.temp }}/apple-results/
            !${{ runner.temp }}/apple-results/attachments/**
            ${{ runner.temp }}/desktop-ui-results.json
            ${{ runner.temp }}/moderation-shots-*/
            ${{ runner.temp }}/received-views-shots-*/
            ${{ runner.temp }}/link-review-shots-*/
            ${{ runner.temp }}/publication-shots-*/
          if-no-files-found: error

  windows:
    name: native - windows
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: prepare axe-core
        shell: pwsh
        run: |
          $archive = Join-Path $env:RUNNER_TEMP 'axe.tgz'
          $directory = Join-Path $env:RUNNER_TEMP 'axe-core'
          Invoke-WebRequest 'https://registry.npmjs.org/axe-core/-/axe-core-4.14.0.tgz' -OutFile $archive
          if ((Get-FileHash $archive -Algorithm SHA256).Hash.ToLowerInvariant() -ne '2277b0a3ef47af9b52497faa3e71598e86e0a0e5e6eb295207a5657ede4709af') { throw 'axe-core checksum mismatch' }
          New-Item -ItemType Directory -Force $directory | Out-Null
          tar -xzf $archive -C $directory --strip-components=1 package/axe.min.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "DYAPP_AXE=$directory/axe.min.js" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: '1.99.0'
      - name: build and unit tests
        shell: pwsh
        run: |
          python tools/scripts/run-check.py --log-dir build/platform-check-output rust-build -- cargo build --manifest-path clients/windows/Cargo.toml --features ui-smoke --locked
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $env:DYAPP_TEST_CREDENTIAL_MANAGER = '1'
          python tools/scripts/run-check.py --log-dir build/platform-check-output rust-test -- cargo test --manifest-path clients/windows/Cargo.toml --features ui-smoke --locked
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: smoke
        shell: pwsh
        run: |
          python tests/scripts/check-windows-icon.py build/debug/dyapp-windows.exe clients/windows/icons/icon.ico
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tests/scripts/desktop-smoke.py build/debug/dyapp-windows.exe
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: windows-app-and-ui
          path: |
            build/platform-check-output/
            build/debug/dyapp-windows.exe
            ${{ runner.temp }}/desktop-ui-results.json
            ${{ runner.temp }}/moderation-shots-*/
            ${{ runner.temp }}/received-views-shots-*/
            ${{ runner.temp }}/link-review-shots-*/
            ${{ runner.temp }}/publication-shots-*/
          if-no-files-found: error

  summary:
    name: required
    runs-on: ubuntu-24.04
    needs: [core, docker, docker-emulators, linux, apple, windows]
    if: always()
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: check
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          python3 tests/scripts/check-ci-results.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: summary-check-output
          path: build/platform-check-output/
          if-no-files-found: error
