name: pr-guard

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  guard:
    name: pr-guard
    runs-on: ubuntu-24.04
    steps:
      # The checker and policy come from the trusted base, never from the PR.
      - name: checkout base
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: fetch PR head
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: git fetch --no-tags origin "refs/pull/$PR_NUMBER/head"
      - name: check diff and dependency age
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: python3 -B tests/scripts/pr-guard.py "$BASE_SHA" "$HEAD_SHA"
      # Extract only workflow data from the fetched PR commit; never check it out.
      - name: extract PR workflows
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          mkdir -p pr-head
          git archive --format=tar "$HEAD_SHA" .github/workflows | tar -xf - -C pr-head
      - name: install pinned workflow linters
        run: |
          container=$(docker create rhysd/actionlint@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667)
          docker cp "$container:/usr/local/bin/actionlint" "$RUNNER_TEMP/actionlint"
          docker rm "$container" > /dev/null
          curl -fsSL -o "$RUNNER_TEMP/zizmor.tgz" https://github.com/zizmorcore/zizmor/releases/download/v1.30.1/zizmor-x86_64-unknown-linux-gnu.tar.gz
          echo "e65324f4430c2717591937edcec90ccbefaf14c174f8ec9415e03ca875b46e1a  $RUNNER_TEMP/zizmor.tgz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/zizmor.tgz" -C "$RUNNER_TEMP" zizmor
      - name: lint PR workflows
        run: |
          "$RUNNER_TEMP/actionlint" pr-head/.github/workflows/*.yml
          "$RUNNER_TEMP/zizmor" --offline --no-progress pr-head/.github
