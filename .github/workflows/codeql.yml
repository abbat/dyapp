name: codeql

on:
  workflow_dispatch:
  push:
  pull_request:
  schedule:
    - cron: '0 0 * * 6'

# The event keeps a push from cancelling the weekly run, which nightly-health reports on.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

env:
  DYAPP_CHECK_LOG_DIR: build/check-output

jobs:
  analyze:
    name: codeql - ${{ matrix.language }}
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        # The languages CodeQL reads without a build. Kotlin and Swift have dedicated build jobs.
        language: ['rust', 'python', 'actions', 'javascript-typescript']

    steps:
    - name: checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: initialize
      uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
      with:
        languages: ${{ matrix.language }}
        build-mode: none
        queries: security-and-quality

    - name: analyze
      uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
      with:
        category: "/language:${{ matrix.language }}"

  kotlin:
    name: codeql - kotlin
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      security-events: write
      actions: read
      contents: read
    steps:
      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: crazy-max/ghaction-github-runtime@04d248b84655b509d8c44dc1d6f990c879747487 # v4.0.0
      # uniffiBindgen builds the host core to generate the Kotlin bindings the app compiles against.
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: '1.99.0'
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: ". -> build"
          key: codeql-kotlin
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # Restore the Rust cache before this export: its archive writes the same build/ tree.
      # Reuse Android's pinned builder and layer cache without loading its SDK image into Docker.
      - name: prepare JNA
        run: |
          python3 tools/scripts/run-check.py --log-dir build/check-output docker -- \
            docker buildx build --file tests/docker/Dockerfile.android-test \
            --target jna-native-export --cache-from type=gha,scope=dyapp-android-tools \
            --output type=local,dest=build/codeql-jna-native .
          test -s build/codeql-jna-native/manifest.json
      - name: install java
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
          cache-dependency-path: |
            clients/android/**/*.gradle
            clients/android/gradle.properties
            clients/android/gradle/wrapper/gradle-wrapper.properties
            clients/android/gradle/verification-metadata.xml
      # Resolve only dependencies before tracing; no app compiler or native build runs here.
      # Keep cold repository failures separate from extraction and avoid tracing dependency setup.
      - name: resolve kotlin dependencies
        working-directory: clients/android
        run: |
          python3 ../../tools/scripts/run-check.py --log-dir ../../build/check-output android-build -- \
            ./gradlew --no-daemon --info --stacktrace :app:dependencies --configuration debugCompileClasspath \
            "-Pdyapp.jnaNativeDir=$GITHUB_WORKSPACE/build/codeql-jna-native"
      - name: init
        uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          languages: java-kotlin
          build-mode: manual
          queries: security-and-quality
      - name: build
        working-directory: clients/android
        # Trace real compilation even with restored Gradle caches; only JNI generation is skipped.
        run: |
          python3 ../../tools/scripts/run-check.py --log-dir ../../build/check-output android-build -- \
            ./gradlew --no-daemon --no-build-cache --rerun-tasks :app:compileDebugKotlin -x cargoNdkDebug \
            "-Pdyapp.jnaNativeDir=$GITHUB_WORKSPACE/build/codeql-jna-native"
      - name: analyze
        uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          category: "/language:java-kotlin"
      - name: check logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: kotlin-check-output
          path: build/check-output/
          if-no-files-found: ignore

  swift:
    name: codeql - swift
    runs-on: macos-15
    timeout-minutes: 60
    permissions:
      security-events: write
      actions: read
      contents: read
    steps:
      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: '1.99.0'
          targets: aarch64-apple-ios,aarch64-apple-ios-sim,x86_64-apple-ios
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: ". -> build"
          key: codeql-swift
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: build core
        run: bash tools/scripts/build-apple-core.sh ios
      - name: prepare xcode
        run: |
          curl -fL https://github.com/yonaskolb/XcodeGen/releases/download/2.46.0/xcodegen.zip -o "$RUNNER_TEMP/xcodegen.zip"
          echo "4d9e34b62172d645eed6457cac13fc222569974098ef4ee9c3368bedf0196806  $RUNNER_TEMP/xcodegen.zip" | shasum -a 256 -c
          unzip -q "$RUNNER_TEMP/xcodegen.zip" -d "$RUNNER_TEMP/xcodegen"
          "$RUNNER_TEMP/xcodegen/xcodegen/bin/xcodegen" generate --spec clients/ios/project.yml --project clients/ios
      - name: init
        uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          languages: swift
          build-mode: manual
          queries: security-and-quality
      - name: build
        run: |
          python3 tools/scripts/run-check.py --log-dir build/check-output apple-build -- \
            xcodebuild build -project clients/ios/DYApp.xcodeproj -scheme DYApp \
            -destination generic/platform=iOS\ Simulator -configuration Debug CODE_SIGNING_ALLOWED=NO
      - name: analyze
        uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          category: "/language:swift"
      - name: check logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: swift-check-output
          path: build/check-output/
          if-no-files-found: ignore

  # custom rust analysis (using clippy for static analysis)
  rust-analysis:
    name: analyze - rust
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      security-events: write

    steps:
    - name: checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: toolchain
      uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
      with:
        toolchain: "1.99.0"
        components: clippy

    # Dependency reports are advisory here; make quality gates Clippy and cargo-deny.
    # Clippy diagnostics below inherit the repository policy and feed SARIF.
    - name: install cargo-deny
      uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
      with:
        tool: cargo-deny@0.20.2

    - name: vulnerable dependencies
      run: python3 tools/scripts/run-check.py --log-dir build/check-output cargo-deny -- cargo deny check advisories
      continue-on-error: true

    - name: license compliance
      run: python3 tools/scripts/run-check.py --log-dir build/check-output cargo-deny -- cargo deny check licenses
      continue-on-error: true

    - name: dependency duplicates
      run: python3 tools/scripts/run-check.py --log-dir build/check-output cargo-deny -- cargo deny check bans
      continue-on-error: true

    - name: unsafe code usage
      run: |
        grep -rn "unsafe {" rust/ --include="*.rs" || echo "  No unsafe code found ✓"

    - name: diagnostics
      id: rust-diagnostics
      run: >-
        python3 tools/scripts/run-check.py --log-dir build/check-output clippy --
        bash -c 'cargo clippy --workspace --all-features --all-targets --locked --message-format=json > clippy.json'

    - name: sarif
      id: rust-sarif
      if: ${{ always() && steps.rust-diagnostics.outcome == 'success' }}
      # Legacy functions within their committed budget are not reported; make quality enforces it.
      run: >-
        python3 tests/scripts/clippy-to-sarif.py clippy.json
        --budget tests/scripts/rust-complexity/workspace.json > clippy.sarif

    - name: upload rust diagnostics
      if: ${{ always() && steps.rust-sarif.outcome == 'success' }}
      uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
      with:
        sarif_file: clippy.sarif
        category: rust-clippy

    - name: check logs
      if: always()
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: analysis-check-output
        path: |
          build/check-output/
          clippy.json
        if-no-files-found: ignore
