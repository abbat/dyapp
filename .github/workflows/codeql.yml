name: codeql

on:
  workflow_dispatch:
  push:
  pull_request:
  schedule:
    - cron: '0 0 * * 6'

# The event keeps a push from cancelling the weekly run, which nightly-health reports on.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  analyze:
    name: codeql - ${{ matrix.language }}
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        # The languages CodeQL reads without a build. Kotlin and Swift have dedicated build jobs.
        language: ['rust', 'python', 'actions', 'javascript-typescript']

    steps:
    - name: checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: initialize
      uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
      with:
        languages: ${{ matrix.language }}
        build-mode: none
        queries: security-and-quality

    - name: analyze
      uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
      with:
        category: "/language:${{ matrix.language }}"

  kotlin:
    name: codeql - kotlin
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      security-events: write
      actions: read
      contents: read
    steps:
      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # uniffiBindgen builds the host core to generate the Kotlin bindings the app compiles against.
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: '1.99.0'
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: ". -> build"
          key: codeql-kotlin
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: install java
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '17'
      - name: init
        uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          languages: java-kotlin
          build-mode: manual
          queries: security-and-quality
      - name: build
        working-directory: clients/android
        # Kotlin compilation needs the bindings, not the NDK-built JNI libraries.
        run: ./gradlew --no-daemon :app:compileDebugKotlin -x cargoNdkDebug
      - name: analyze
        uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          category: "/language:java-kotlin"

  swift:
    name: codeql - swift
    runs-on: macos-15
    timeout-minutes: 60
    permissions:
      security-events: write
      actions: read
      contents: read
    steps:
      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: '1.99.0'
          targets: aarch64-apple-ios,aarch64-apple-ios-sim,x86_64-apple-ios
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: ". -> build"
          key: codeql-swift
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: build core
        run: bash tools/scripts/build-apple-core.sh ios
      - name: prepare xcode
        run: |
          curl -fL https://github.com/yonaskolb/XcodeGen/releases/download/2.46.0/xcodegen.zip -o "$RUNNER_TEMP/xcodegen.zip"
          echo "4d9e34b62172d645eed6457cac13fc222569974098ef4ee9c3368bedf0196806  $RUNNER_TEMP/xcodegen.zip" | shasum -a 256 -c
          unzip -q "$RUNNER_TEMP/xcodegen.zip" -d "$RUNNER_TEMP/xcodegen"
          "$RUNNER_TEMP/xcodegen/xcodegen/bin/xcodegen" generate --spec clients/ios/project.yml --project clients/ios
      - name: init
        uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          languages: swift
          build-mode: manual
          queries: security-and-quality
      - name: build
        run: |
          xcodebuild build -project clients/ios/DYApp.xcodeproj -scheme DYApp \
            -destination generic/platform=iOS\ Simulator -configuration Debug CODE_SIGNING_ALLOWED=NO
      - name: analyze
        uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          category: "/language:swift"

  # custom rust analysis (using clippy for static analysis)
  rust-analysis:
    name: analyze - rust
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      security-events: write

    steps:
    - name: checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: toolchain
      uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
      with:
        toolchain: stable
        components: clippy

    # The four steps below are advisory: the gating clippy and cargo-deny runs are in make quality
    # (tests/scripts/rust-check.sh); here a finding must not stop the SARIF upload.
    - name: install cargo-deny
      uses: taiki-e/install-action@1e29709c0ec63babbe8f266397a465f29a825f91 # v2.87.31
      with:
        tool: cargo-deny@0.20.2

    - name: clippy
      run: python3 tools/scripts/run-check.py --log-dir build/check-output clippy -- cargo clippy --workspace --all-features --all-targets -- -D warnings -W clippy::all -W clippy::pedantic
      continue-on-error: true

    - name: vulnerable dependencies
      run: python3 tools/scripts/run-check.py --log-dir build/check-output cargo-deny -- cargo deny check advisories
      continue-on-error: true

    - name: license compliance
      run: python3 tools/scripts/run-check.py --log-dir build/check-output cargo-deny -- cargo deny check licenses
      continue-on-error: true

    - name: dependency duplicates
      run: python3 tools/scripts/run-check.py --log-dir build/check-output cargo-deny -- cargo deny check duplicates
      continue-on-error: true

    - name: unsafe code usage
      run: |
        grep -rn "unsafe {" rust/ --include="*.rs" || echo "  No unsafe code found ✓"

    - name: diagnostics
      run: cargo clippy --workspace --all-features --all-targets --locked --message-format=json > clippy.json

    - name: sarif
      if: always()
      run: python3 tests/scripts/clippy-to-sarif.py clippy.json > clippy.sarif

    - name: check logs
      if: always()
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: analysis-check-output
        path: build/check-output/
        if-no-files-found: ignore
