name: codeql

on:
  workflow_dispatch:
  push:
  pull_request:
  schedule:
    - cron: '0 0 * * 6'

permissions: {}

jobs:
  analyze:
    name: codeql - ${{ matrix.language }}
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        # The languages CodeQL reads without a build. Java/Kotlin and Swift (the mobile apps)
        # need one and are not analysed yet.
        language: ['rust', 'python', 'actions', 'javascript-typescript']

    steps:
    - name: checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: initialize
      uses: github/codeql-action/init@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
      with:
        languages: ${{ matrix.language }}
        build-mode: none
        queries: security-and-quality

    - name: analyze
      uses: github/codeql-action/analyze@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
      with:
        category: "/language:${{ matrix.language }}"

  # custom rust analysis (using clippy for static analysis)
  rust-analysis:
    name: analyze - rust
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write

    steps:
    - name: checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: toolchain
      uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master
      with:
        toolchain: stable
        components: clippy

    - name: install cargo-deny
      run: cargo install cargo-deny

    - name: clippy
      run: python3 scripts/run-check.py --log-dir target/check-output clippy -- cargo clippy --workspace --all-features --all-targets -- -D warnings -W clippy::all -W clippy::pedantic
      continue-on-error: true

    - name: vulnerable dependencies
      run: python3 scripts/run-check.py --log-dir target/check-output cargo-deny -- cargo deny check advisories
      continue-on-error: true

    - name: license compliance
      run: python3 scripts/run-check.py --log-dir target/check-output cargo-deny -- cargo deny check licenses
      continue-on-error: true

    - name: dependency duplicates
      run: python3 scripts/run-check.py --log-dir target/check-output cargo-deny -- cargo deny check duplicates
      continue-on-error: true

    - name: unsafe code usage
      run: |
        grep -rn "unsafe {" rust/ --include="*.rs" || echo "  No unsafe code found ✓"

    - name: diagnostics
      run: cargo clippy --workspace --all-features --all-targets --locked --message-format=json > clippy.json

    - name: sarif
      if: always()
      run: python3 scripts/clippy-to-sarif.py clippy.json > clippy.sarif

    - name: check logs
      if: always()
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: analysis-check-output
        path: target/check-output/
        if-no-files-found: ignore
