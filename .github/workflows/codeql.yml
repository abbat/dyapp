name: codeql

# Disabled: code scanning is unavailable for this private repository.
# Uncomment the triggers once it is enabled.
on:
  workflow_dispatch:
#  push:
#  pull_request:
#  schedule:
#    - cron: '0 0 * * 6'

jobs:
  analyze:
    name: analyze - cpp
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        language: ['cpp']  # rust support via SARIF

    steps:
    - name: checkout
      uses: actions/checkout@v7

    - name: initialize
      uses: github/codeql-action/init@v4
      with:
        languages: ${{ matrix.language }}
        queries: security-and-quality
        # optional: disable default queries and use security-only or extended suite
        # queries: security-only

    # autobuild attempts to build any compiled languages (c/c++, c#, go, java, or swift).
    # if this step fails, then you should remove it and run the build manually
    - name: autobuild
      uses: github/codeql-action/autobuild@v4

    - name: analyze
      uses: github/codeql-action/analyze@v4
      with:
        category: "/language:cpp"

  # custom rust analysis (using clippy for static analysis)
  rust-analysis:
    name: analyze - rust
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write

    steps:
    - name: checkout
      uses: actions/checkout@v7

    - name: toolchain
      uses: dtolnay/rust-toolchain@stable
      with:
        components: clippy

    - name: install cargo-deny
      run: cargo install cargo-deny

    - name: clippy
      run: cargo clippy --workspace --all-features --all-targets -- -D warnings -W clippy::all -W clippy::pedantic
      continue-on-error: true

    - name: vulnerable dependencies
      run: cargo deny check advisories
      continue-on-error: true

    - name: license compliance
      run: cargo deny check licenses
      continue-on-error: true

    - name: dependency duplicates
      run: cargo deny check duplicates
      continue-on-error: true

    - name: unsafe code usage
      run: |
        grep -rn "unsafe {" rust/ --include="*.rs" || echo "  No unsafe code found ✓"

    - name: hardcoded secrets
      run: |
        grep -rn "password\|secret\|token\|key\|credential" rust/ --include="*.rs" | grep -v "// " || echo "  No hardcoded secrets found ✓"
        true

    - name: diagnostics
      run: cargo clippy --workspace --all-features --all-targets --locked --message-format=json > clippy.json

    - name: sarif
      if: always()
      run: python3 scripts/clippy-to-sarif.py clippy.json > clippy.sarif
