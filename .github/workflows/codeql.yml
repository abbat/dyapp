name: codeql

on:
  workflow_dispatch:
  push:
  pull_request:
  schedule:
    - cron: '0 0 * * 6'

permissions: {}

jobs:
  analyze:
    name: codeql - ${{ matrix.language }}
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        # The languages CodeQL reads without a build. Java/Kotlin and Swift (the mobile apps)
        # need one and are not analysed yet.
        language: ['rust', 'python', 'actions', 'javascript-typescript']

    steps:
    - name: checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: initialize
      uses: github/codeql-action/init@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
      with:
        languages: ${{ matrix.language }}
        build-mode: none
        queries: security-and-quality

    - name: analyze
      uses: github/codeql-action/analyze@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
      with:
        category: "/language:${{ matrix.language }}"

  # custom rust analysis (using clippy for static analysis)
  rust-analysis:
    name: analyze - rust
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      security-events: write

    steps:
    - name: checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: toolchain
      uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
      with:
        toolchain: stable
        components: clippy

    # The four steps below are advisory: the gating clippy and cargo-deny runs are in make quality
    # (tests/scripts/rust-check.sh); here a finding must not stop the SARIF upload.
    - name: install cargo-deny
      uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
      with:
        tool: cargo-deny@0.20.2

    - name: clippy
      run: python3 tools/scripts/run-check.py --log-dir build/check-output clippy -- cargo clippy --workspace --all-features --all-targets -- -D warnings -W clippy::all -W clippy::pedantic
      continue-on-error: true

    - name: vulnerable dependencies
      run: python3 tools/scripts/run-check.py --log-dir build/check-output cargo-deny -- cargo deny check advisories
      continue-on-error: true

    - name: license compliance
      run: python3 tools/scripts/run-check.py --log-dir build/check-output cargo-deny -- cargo deny check licenses
      continue-on-error: true

    - name: dependency duplicates
      run: python3 tools/scripts/run-check.py --log-dir build/check-output cargo-deny -- cargo deny check duplicates
      continue-on-error: true

    - name: unsafe code usage
      run: |
        grep -rn "unsafe {" rust/ --include="*.rs" || echo "  No unsafe code found ✓"

    - name: diagnostics
      run: cargo clippy --workspace --all-features --all-targets --locked --message-format=json > clippy.json

    - name: sarif
      if: always()
      run: python3 tests/scripts/clippy-to-sarif.py clippy.json > clippy.sarif

    - name: check logs
      if: always()
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: analysis-check-output
        path: build/check-output/
        if-no-files-found: ignore
