name: Code Linting & Formatting
on:
  workflow_call:
permissions:
  contents: read
jobs:
  quality:
    name: Complete Docker quality checks
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Prepare isolated dependency image
        run: bash scripts/docker-test.sh prepare
      - name: Check the complete repository
        run: bash scripts/docker-test.sh quality
