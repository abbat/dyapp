name: quality

on:
  workflow_call:

permissions:
  contents: read

jobs:
  quality:
    name: quality
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: prepare
        run: bash scripts/docker-test.sh prepare
      - name: check
        run: bash scripts/docker-test.sh quality
