name: release-sizes

on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

permissions:
  contents: read

env:
  DYAPP_CHECK_LOG_DIR: build/release-check-output

jobs:
  windows:
    name: release - windows
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: '1.99.0'
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: ". -> build"
      - name: build and measure
        shell: pwsh
        run: |
          python tools/scripts/run-check.py --log-dir build/release-check-output rust-build -- cargo build --manifest-path clients/windows/Cargo.toml --release --locked
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/scripts/report-artifact-size.py windows-2022-x86_64-release build/release/dyapp-windows.exe --environment "windows-2022; rustc 1.99.0; x86_64; release; unsigned EXE" --report build/release-size-windows.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: size budget
        shell: pwsh
        run: |
          $base = git rev-parse HEAD^
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $head = git rev-parse HEAD
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/scripts/check-artifact-size.py windows-2022-x86_64-release build/release/dyapp-windows.exe --base $base --head $head --report build/artifact-size-windows.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: portable zip
        shell: pwsh
        run: |
          python tools/scripts/package-windows-zip.py build/release/dyapp-windows.exe build/windows-zip
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Expand-Archive -Path build/windows-zip/*.zip -DestinationPath $env:RUNNER_TEMP/portable
          $exe = Get-ChildItem $env:RUNNER_TEMP/portable/*/dyapp.exe
          python tests/scripts/desktop-smoke.py $exe.FullName
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-zip
          path: build/windows-zip/
          if-no-files-found: error
      - name: evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-size-windows
          path: |
            build/release-check-output/
            build/release-size-windows.json
            build/artifact-size-windows.json
          if-no-files-found: error

  android:
    name: release - android
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      DYAPP_BUILD_CACHE: gha
      ANDROID_ENVIRONMENT: "dyapp:android-test; AGP 9.4.1; NDK 29.0.14206865; rustc 1.99.0; arm64-v8a+x86_64 release JNI"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      # buildx keeps its own copy of each image before --load.
      - name: free disk
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: crazy-max/ghaction-github-runtime@04d248b84655b509d8c44dc1d6f990c879747487 # v4.0.0
      - name: build and measure
        run: |
          python3 tools/scripts/docker-local.py -f tests/docker/compose.ui.yml --profile all build android-unit-test
          mkdir -p build/android-release && chmod 777 build/android-release
          docker run --rm --network none --user 999:999 \
            -e DYAPP_CHECK_LOG_DIR=/reports/check-output \
            -v "$PWD/build/android-release:/reports" \
            dyapp:android-test bash /app/tools/scripts/build-android-release.sh /reports
          for package in apk:app-release-unsigned.apk aab:app-release.aab; do
            kind=${package%%:*}
            python3 tools/scripts/report-artifact-size.py "android-$kind-release-unsigned" \
              "build/android-release/${package#*:}" \
              --environment "$ANDROID_ENVIRONMENT; unsigned ${kind^^}" \
              --report "build/release-size-android-$kind.json"
          done
      - name: size budget
        run: |
          for package in apk:app-release-unsigned.apk aab:app-release.aab; do
            kind=${package%%:*}
            python3 tools/scripts/check-artifact-size.py "android-$kind-release-unsigned" \
              "build/android-release/${package#*:}" --base "$(git rev-parse HEAD^)" \
              --head "$(git rev-parse HEAD)" --report "build/artifact-size-android-$kind.json"
          done
      - name: evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-size-android
          path: |
            build/android-release/check-output/
            build/android-release/*.json
            build/android-release/build.log
            build/release-size-android-*.json
            build/artifact-size-android-*.json
          if-no-files-found: error

  apple:
    name: release - ${{ matrix.platform }}
    runs-on: macos-15
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ios
            core: ios-device
            targets: aarch64-apple-ios
          - platform: macos
            core: macos
            targets: aarch64-apple-darwin,x86_64-apple-darwin
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: '1.99.0'
          targets: ${{ matrix.targets }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: release-${{ matrix.platform }}
      - name: release core
        run: bash tools/scripts/build-apple-core.sh "${{ matrix.core }}" release
      - name: prepare xcode
        run: |
          curl -fL https://github.com/yonaskolb/XcodeGen/releases/download/2.46.0/xcodegen.zip -o "$RUNNER_TEMP/xcodegen.zip"
          unzip -q "$RUNNER_TEMP/xcodegen.zip" -d "$RUNNER_TEMP/xcodegen"
          "$RUNNER_TEMP/xcodegen/xcodegen/bin/xcodegen" generate --spec "clients/${{ matrix.platform }}/project.yml" --project "clients/${{ matrix.platform }}"
      - name: build and measure
        run: python3 -B tools/scripts/apple-release-in-ci.py "${{ matrix.platform }}"
      - name: evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-size-${{ matrix.platform }}
          path: |
            build/release-check-output/
            ${{ runner.temp }}/release-${{ matrix.platform }}/*.json
            ${{ runner.temp }}/release-${{ matrix.platform }}/*.txt
            ${{ runner.temp }}/release-${{ matrix.platform }}/*.log
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: apple-${{ matrix.platform }}-unsigned
          path: ${{ runner.temp }}/release-${{ matrix.platform }}/DYApp-unsigned.*
          if-no-files-found: error

