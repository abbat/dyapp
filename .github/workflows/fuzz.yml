name: fuzz

# Practice B4: one hour per fuzz target. Pushes fuzz 60 seconds per target (ci-base.yml).
on:
  schedule:
    - cron: "41 1 * * *"
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_INCREMENTAL: "0"
  DYAPP_CHECK_LOG_DIR: /tmp/ai/rust-check-output

jobs:
  fuzz:
    name: fuzz - ${{ matrix.target }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        target: [node, profile, mailbox, media, search, inventory, digest, gossip]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: setup
        run: bash tools/scripts/ci-setup.sh rust
      - uses: taiki-e/install-action@1168f6810a3cb30a3514bf5756a3b7f0422c6df8 # v2.87.28
        with:
          tool: cargo-fuzz@0.13.2
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: "tests/fuzz -> ../../build/fuzz"
      - name: fuzz
        env:
          FUZZ_TARGETS: ${{ matrix.target }}
          FUZZ_SECONDS: "3600"
        run: bash tests/scripts/rust-check.sh fuzz
      # New inputs, to merge into tests/fuzz/corpus by hand (docs/testing/README.md#fuzzing).
      - name: corpus and crashes
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-${{ matrix.target }}
          path: |
            build/fuzz-corpus/
            build/fuzz-artifacts/
          if-no-files-found: warn
