name: security

on:
  push:
  pull_request:
  schedule:
    - cron: '0 0 * * 0'

permissions:
  contents: read

jobs:
  audit:
    name: audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Prebuilt binary: audit-check compiled cargo-audit on every run.
      - uses: taiki-e/install-action@1168f6810a3cb30a3514bf5756a3b7f0422c6df8 # v2.87.28
        with:
          tool: cargo-audit@0.22.2
      - run: python3 tools/scripts/run-check.py --log-dir build/check-output cargo-audit -- cargo audit
      - name: check logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: audit-check-output
          path: build/check-output/
          if-no-files-found: ignore

  sbom:
    name: sbom
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Prebuilt release binary, pinned by checksum; the toolchain comes from rust-toolchain.toml.
      - name: install cargo-sbom
        run: |
          curl -fsSLo "$HOME/.cargo/bin/cargo-sbom" https://github.com/psastras/sbom-rs/releases/download/cargo-sbom-v0.10.0/cargo-sbom-x86_64-unknown-linux-gnu
          echo "860a50d3e009c72fefc12506869cc11ea34d240c65da65cda2c491ed2aaa34f3  $HOME/.cargo/bin/cargo-sbom" | sha256sum -c
          chmod +x "$HOME/.cargo/bin/cargo-sbom"
      - run: cargo sbom --output-format spdx_json_2_3 > sbom.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom
          path: sbom.json
          if-no-files-found: error

  # Scheduled only: a passed or near review date fails here, and nightly-health turns that into a
  # tracked issue. make quality checks the same dates without expiry.
  review-dates:
    name: review-dates
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: python3 -B tests/scripts/check-advisory-ignores.py --raw --expiry
