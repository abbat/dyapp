name: rust

on:
  workflow_call:

permissions:
  contents: read

jobs:
  quality:
    name: quality
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      DYAPP_BUILD_CACHE: gha
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: crazy-max/ghaction-github-runtime@v3
      - name: prepare
        run: bash scripts/docker-test.sh prepare
      - name: check
        run: bash scripts/docker-test.sh quality

  core:
    name: build
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      DYAPP_BUILD_CACHE: gha
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: crazy-max/ghaction-github-runtime@v3
      - name: prepare
        run: bash scripts/docker-test.sh prepare
      - name: build
        run: bash scripts/docker-test.sh build
      - name: tests
        run: bash scripts/docker-test.sh test
      - name: coverage
        run: bash scripts/docker-test.sh coverage
      - name: coverage export
        if: always()
        run: python3 scripts/export-coverage.py "$RUNNER_TEMP/coverage"
      - name: coverage upload
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: rust-workspace-coverage
          path: ${{ runner.temp }}/coverage/coverage.*
          if-no-files-found: error
      - name: deny
        run: bash scripts/docker-test.sh security
      - name: network
        run: |
          bash scripts/docker-test.sh network-prepare
          bash scripts/docker-test.sh network
