name: rust

on:
  workflow_call:

permissions:
  contents: read

# The jobs run on the runner itself; scripts/rust-check.sh holds the commands that the dev
# Docker image runs locally.
env:
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: "0"
  CXXFLAGS: "-g0"
  RUST_BACKTRACE: "1"

jobs:
  quality:
    name: quality
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - name: setup
        run: bash scripts/ci-setup.sh rust
      - uses: Swatinem/rust-cache@v2
      - name: check
        run: bash scripts/rust-check.sh quality

  core:
    name: build
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - name: setup
        run: bash scripts/ci-setup.sh rust
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov@0.6.21,cargo-deny@0.19.9
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target/llvm-cov-target"
      # One instrumented build serves the tests, the network peers and the coverage report.
      - name: build
        run: bash scripts/rust-check.sh cov-build
      - name: tests
        run: bash scripts/rust-check.sh cov-test
      - name: coverage
        run: bash scripts/rust-check.sh cov-report
      - name: coverage upload
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rust-workspace-coverage
          path: target/coverage/coverage.*
          if-no-files-found: error
      - name: deny
        run: bash scripts/rust-check.sh security
      - name: network
        run: bash scripts/rust-check.sh network
