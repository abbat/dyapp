name: scorecard

# Practice C3 (docs/security/scorecard.md): the OpenSSF Scorecard of the repository, weekly and
# after each push to main, published to code scanning and to the Scorecard API.
on:
  schedule:
    - cron: "37 4 * * 1"
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

jobs:
  # Scorecard verifies this job before it accepts published results: only approved actions,
  # no run steps.
  publish:
    name: scorecard - publish
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      id-token: write
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true
      - uses: github/codeql-action/upload-sarif@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          sarif_file: results.sarif

  score:
    name: scorecard - score
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: scorecard.json
          results_format: json
          publish_results: false
      # The score must not drop below [scorecard] score in tests/scripts/baselines.toml.
      - name: score
        run: python3 -B tests/scripts/check-scorecard.py scorecard.json
      - name: results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: scorecard
          path: scorecard.json
          if-no-files-found: warn
