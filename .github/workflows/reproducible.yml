name: reproducible

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compare:
    name: release - ${{ matrix.target }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: dyappd
            setup: rust
          - target: linux
            setup: linux
    env:
      CARGO_BUILD_JOBS: "4"
      CMAKE_BUILD_PARALLEL_LEVEL: "4"
      MAKEFLAGS: "-j4"
      RAYON_NUM_THREADS: "4"
      CXXFLAGS: "-g0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: setup
        run: bash scripts/ci-setup.sh "${{ matrix.setup }}"
      # No Cargo build cache: both target directories must start empty.
      - name: compare
        run: python3 -B scripts/check-reproducible.py "${{ matrix.target }}"
      - name: evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: reproducible-${{ matrix.target }}
          path: |
            target/reproducible-*.json
            target/reproducible/**/build-*.log
          if-no-files-found: error
