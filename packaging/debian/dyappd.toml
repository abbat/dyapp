# dyappd configuration. Every key is optional; the commented values are the defaults.
# All keys: docs/operations/deployment.md. Apply changes with `systemctl restart dyappd`.
# The deny list is edited with `sudo -u dyappd dyappd deny add|remove|list`.

# listen = ["/ip4/0.0.0.0/tcp/7070", "/ip4/0.0.0.0/udp/7070/quic-v1"]
# external = []        # addresses announced to peers
# seeds = []           # nodes to join through, e.g. "/dnsaddr/seeds.example.org"
# roles = ["store"]    # add "media" to serve media blobs

[storage]
# dir = "/var/lib/dyappd"   # another path needs ReadWritePaths= in a unit drop-in

[limits]
# message_ttl_hours = 24
# monthly_traffic_gb = 0        # 0 = no cap
# bytes_per_second = 0          # 0 = no limit
