# Configuration for the pinned cargo-deny 0.20.2 gate (dev image and CI).
[graph]
all-features = true

[advisories]
db-urls = ["https://github.com/rustsec/advisory-db"]
db-path = "/tmp/ai/advisory-dbs"
yanked = "deny"
ignore = [
    # paste is unmaintained (no fix): a compile-time proc-macro pulled in by
    # libp2p-quic/tcp -> if-watch -> netlink-packet-core. Drop when if-watch
    # moves off it.
    { id = "RUSTSEC-2024-0436", reason = "unmaintained proc-macro via if-watch, no upgrade; review by 2026-11-21 (issue #22)" },
    # basic-toml is archived (no fix): parses askama templates at compile time for
    # uniffi's binding generator. Drop when askama moves to `toml`.
    { id = "RUSTSEC-2026-0374", reason = "unmaintained build-time parser via uniffi -> askama, no upgrade; review by 2026-11-21 (issue #22)" },
    # proc-macro-error2 is unmaintained (no fix): a compile-time proc-macro of hax-lib,
    # the verification annotations of libcrux (openmls -> hpke-rs). Drop when hax-lib-macros
    # moves off it.
    { id = "RUSTSEC-2026-0173", reason = "unmaintained proc-macro via openmls -> hpke-rs -> libcrux -> hax-lib, no upgrade; review by 2026-11-21 (issue #22)" },
    # libcrux-kem 0.0.9 panics on a short hybrid seed or key (fixed in 0.0.10): hpke-rs-libcrux
    # 0.7 pins it and openmls_rust_crypto 0.6 needs hpke-rs 0.7. Only the hybrid KEMs are hit;
    # dyapp accepts ciphersuite 0x0001 (DHKEM X25519) only. Keep in sync with
    # .cargo/audit.toml and osv-scanner.toml; drop both when openmls moves to hpke-rs 0.8.
    { id = "RUSTSEC-2026-0330", reason = "hybrid KEM panic in libcrux-kem pinned by hpke-rs 0.7; suite 0x0001 only; review by 2026-11-21 (issue #22)" },
    { id = "RUSTSEC-2026-0331", reason = "hybrid KEM panic in libcrux-kem pinned by hpke-rs 0.7; suite 0x0001 only; review by 2026-11-21 (issue #22)" },
    # Temporary risk acceptance: MLS suite 0x0001 uses X25519/Ed25519, while the
    # vulnerable crypto-bigint 0.5.5 enters through unconditional P-curve deps.
    # Reachability is not proven absent. Review by 2026-11-24: GH issue #25.
    { id = "RUSTSEC-2026-0387", reason = "temporary acceptance: crypto-bigint 0.5.5 in unused MLS P-curve paths; review by 2026-11-24 (issue #25)" },
]

[licenses]
confidence-threshold = 0.8
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    # Approved after checking packaged licenses: foldhash, ICU4X/unicode-ident,
    # webpki-root-certs, and noise-protocol (manifest plus README).
    "Zlib",
    "Unicode-3.0",
    "CDLA-Permissive-2.0",
    "Unlicense",
    "MPL-2.0",
]
exceptions = [
    { allow = ["Apache-2.0"], crate = "rustls" },
]

[bans]
multiple-versions = "deny"
highlight = "all"
deny = ["openssl", "openssl-sys"]
# Older copies kept by dependencies, not by our own choice. A new duplicate fails; drop an
# entry when its last user upgrades (cargo-deny warns about an unmatched skip).
skip = [
    # RustCrypto 0.10 generation: snow (libp2p-noise), aes-gcm and ccm (webrtc rtc-crypto).
    { crate = "aead@0.5.2", reason = "snow and webrtc stay on RustCrypto 0.10" },
    { crate = "block-buffer@0.10.4", reason = "snow and webrtc stay on RustCrypto 0.10" },
    { crate = "chacha20@0.9.1", reason = "snow and webrtc stay on RustCrypto 0.10" },
    { crate = "chacha20poly1305@0.10.1", reason = "snow and webrtc stay on RustCrypto 0.10" },
    { crate = "cipher@0.4.4", reason = "snow and webrtc stay on RustCrypto 0.10" },
    { crate = "cpufeatures@0.2.17", reason = "snow and webrtc stay on RustCrypto 0.10" },
    { crate = "crypto-common@0.1.7", reason = "snow and webrtc stay on RustCrypto 0.10" },
    { crate = "curve25519-dalek@4.1.3", reason = "snow and webrtc stay on RustCrypto 0.10" },
    { crate = "digest@0.10.7", reason = "snow and webrtc stay on RustCrypto 0.10" },
    { crate = "fiat-crypto@0.2.9", reason = "snow and webrtc stay on RustCrypto 0.10" },
    { crate = "hmac@0.12.1", reason = "snow and webrtc stay on RustCrypto 0.10" },
    { crate = "inout@0.1.4", reason = "snow and webrtc stay on RustCrypto 0.10" },
    { crate = "poly1305@0.8.0", reason = "snow and webrtc stay on RustCrypto 0.10" },
    { crate = "sha2@0.10.9", reason = "snow and webrtc stay on RustCrypto 0.10" },
    { crate = "universal-hash@0.5.1", reason = "snow and webrtc stay on RustCrypto 0.10" },
    { crate = "rand_core@0.6.4", reason = "snow and webrtc stay on RustCrypto 0.10" },
    # rand 0.9 / getrandom 0.2-0.3: ring, governor, proptest, libp2p-noise.
    { crate = "getrandom@0.2.17", reason = "ring and ahash use getrandom 0.2" },
    { crate = "getrandom@0.3.4", reason = "governor, libp2p-noise and snow use getrandom 0.3" },
    { crate = "r-efi@5.3.0", reason = "getrandom 0.3" },
    { crate = "rand@0.9.5", reason = "governor and proptest use rand 0.9" },
    { crate = "rand_core@0.9.5", reason = "governor and proptest use rand 0.9" },
    # X.509 and DTLS: webrtc on x509-parser 0.16, libp2p-tls on rcgen 0.13.
    { crate = "asn1-rs@0.6.2", reason = "webrtc uses x509-parser 0.16" },
    { crate = "asn1-rs-derive@0.5.1", reason = "webrtc uses x509-parser 0.16" },
    { crate = "der-parser@9.0.0", reason = "webrtc uses x509-parser 0.16" },
    { crate = "oid-registry@0.7.1", reason = "webrtc uses x509-parser 0.16" },
    { crate = "x509-parser@0.16.0", reason = "webrtc uses x509-parser 0.16" },
    { crate = "thiserror@1.0.69", reason = "x509-parser 0.16 and rtnetlink use thiserror 1" },
    { crate = "thiserror-impl@1.0.69", reason = "x509-parser 0.16 and rtnetlink use thiserror 1" },
    { crate = "synstructure@0.13.2", reason = "asn1-rs-derive uses synstructure 0.13" },
    { crate = "syn@2.0.119", reason = "asn1-rs-derive, curve25519-dalek-derive and jni-macros use syn 2" },
    { crate = "rcgen@0.13.2", reason = "libp2p-tls uses rcgen 0.13" },
    { crate = "pem@3.0.6", reason = "rcgen 0.13 and webrtc use pem 3" },
    { crate = "yasna@0.5.2", reason = "rcgen 0.13 uses yasna 0.5" },
    # openmls 0.9: ed25519-dalek 2 and its RustCrypto 0.7 generation, hpke-rs on x25519-dalek 2.
    { crate = "ed25519-dalek@2.2.0", reason = "openmls_rust_crypto and openmls_basic_credential use ed25519-dalek 2" },
    { crate = "ed25519@2.2.3", reason = "ed25519-dalek 2 (openmls)" },
    { crate = "signature@2.2.0", reason = "ed25519 2 (openmls) and ecdsa 0.16" },
    { crate = "pkcs8@0.10.2", reason = "ed25519 2 (openmls) and elliptic-curve 0.13" },
    { crate = "spki@0.7.3", reason = "pkcs8 0.10 and ecdsa 0.16" },
    { crate = "der@0.7.10", reason = "pkcs8 0.10, sec1 0.7 and ecdsa 0.16" },
    { crate = "const-oid@0.9.6", reason = "der 0.7 and digest 0.10" },
    { crate = "hkdf@0.12.4", reason = "elliptic-curve 0.13 (openmls_rust_crypto p256)" },
    { crate = "rand_chacha@0.3.1", reason = "openmls_rust_crypto uses rand_chacha 0.3" },
    { crate = "rand_chacha@0.9.0", reason = "rand 0.9 (governor and proptest)" },
    { crate = "x25519-dalek@2.0.1", reason = "hpke-rs-rust-crypto (openmls) uses x25519-dalek 2" },
    # Single stragglers.
    { crate = "shlex@1.3.0", reason = "bindgen uses shlex 1" },
    { crate = "base64@0.22.1", reason = "attohttpc and rtc-stun use base64 0.22" },
    { crate = "bitflags@1.3.2", reason = "webrtc rtc-shared uses bitflags 1" },
    { crate = "nix@0.30.1", reason = "rtnetlink uses nix 0.30" },
    { crate = "quinn-udp@0.5.16", reason = "quinn and webrtc pin different quinn-udp" },
    { crate = "foldhash@0.1.5", reason = "hashbrown 0.15 (petgraph) uses foldhash 0.1" },
    { crate = "hashbrown@0.12.3", reason = "lru 0.7" },
    { crate = "hashbrown@0.14.5", reason = "dashmap 6" },
    { crate = "hashbrown@0.15.5", reason = "petgraph 0.8" },
    { crate = "hashbrown@0.16.1", reason = "governor and rsqlite-vfs" },
    { crate = "windows-sys@0.52.0", reason = "ring and memory-stats use windows-sys 0.52" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
