plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.plugin.compose'
}

android {
    namespace "com.dyapp"
    compileSdk 37

    defaultConfig {
        applicationId "com.dyapp"
        minSdk 31
        targetSdk 36
        versionCode 1
        versionName "0.0.1"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        vectorDrawables {
            useSupportLibrary true
        }
    }

    buildTypes {
        // Practice D1: en-XA and ar-XB pseudo-locales for the UI tests.
        debug {
            pseudoLocalesEnabled true
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    buildFeatures {
        compose true
        buildConfig true
    }

    packaging {
        resources {
            excludes += '/META-INF/{AL2.0,LGPL2.1}'
        }
    }
}

dependencies {
    // Core Android
    implementation 'androidx.core:core-ktx:1.19.1'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.11.0'
    implementation 'androidx.activity:activity-compose:1.13.0'

    // Compose
    implementation platform('androidx.compose:compose-bom:2026.09.00')
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-graphics'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    implementation 'androidx.compose.material3:material3'

    // UniFFI's Kotlin bindings call the Rust core through JNA.
    implementation 'net.java.dev.jna:jna:5.19.1@aar'

    // Testing
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.3.0'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.7.0'
    androidTestImplementation platform('androidx.compose:compose-bom:2026.09.00')
    androidTestImplementation 'androidx.compose.ui:ui-test-junit4'

    debugImplementation 'androidx.compose.ui:ui-tooling'
    debugImplementation 'androidx.compose.ui:ui-test-manifest'
}

// The Rust core (rust/ffi) is built with cargo-ndk and its Kotlin bindings are generated by
// uniffi-bindgen; both land in build/rust and are never committed.
def rustRoot = rootProject.file('../..')
def rustOut = layout.buildDirectory.dir('rust').get().asFile
// The Docker unit-test run reuses the outputs of its image build: the Rust sources are read-only there.
def prebuiltRust = providers.gradleProperty('dyapp.prebuiltRust').isPresent()

// Library mode reads the interface from a host build of the library; `cargo run` of the bin
// alone does not produce the cdylib.
def cargoHost = tasks.register('cargoHost', Exec) {
    onlyIf { !prebuiltRust }
    workingDir rustRoot
    commandLine 'cargo', 'build', '--locked', '-p', 'dyapp-ffi'
}
def uniffiBindgen = tasks.register('uniffiBindgen', Exec) {
    onlyIf { !prebuiltRust }
    dependsOn cargoHost
    workingDir rustRoot
    commandLine 'build/debug/uniffi-bindgen', 'generate', '--library', 'build/debug/libdyapp_ffi.so',
        '--language', 'kotlin', '--no-format', '--out-dir', "$rustOut/kotlin"
}
android.sourceSets.main.kotlin.srcDir("$rustOut/kotlin")

['debug', 'release'].each { buildType ->
    def jniLibs = "$rustOut/$buildType/jniLibs"
    def cargoNdk = tasks.register("cargoNdk${buildType.capitalize()}", Exec) {
        onlyIf { !prebuiltRust }
        workingDir rustRoot
        // An unoptimised core with debuginfo is hundreds of MB per ABI.
        environment 'CARGO_PROFILE_DEV_DEBUG', '0'
        commandLine(['cargo', 'ndk', '--platform', '31', '-t', 'arm64-v8a', '-t', 'x86_64', '-o', jniLibs,
            'build', '--locked', '-p', 'dyapp-ffi', '--lib'] + (buildType == 'release' ? ['--release'] : []))
    }
    android.sourceSets[buildType].jniLibs.srcDir(jniLibs)
    tasks.matching { it.name == "pre${buildType.capitalize()}Build" }.configureEach {
        dependsOn cargoNdk, uniffiBindgen
    }
}
