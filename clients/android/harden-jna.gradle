import groovy.json.JsonSlurper
import java.nio.file.Files
import java.security.MessageDigest
import java.util.zip.ZipFile
import org.gradle.api.GradleException
import org.gradle.api.artifacts.transform.CacheableTransform
import org.gradle.api.artifacts.transform.InputArtifact
import org.gradle.api.artifacts.transform.TransformAction
import org.gradle.api.artifacts.transform.TransformOutputs
import org.gradle.api.artifacts.transform.TransformParameters
import org.gradle.api.artifacts.type.ArtifactTypeDefinition
import org.gradle.api.attributes.Attribute
import org.gradle.api.file.DirectoryProperty
import org.gradle.api.file.FileSystemLocation
import org.gradle.api.provider.Provider
import org.gradle.api.tasks.InputDirectory
import org.gradle.api.tasks.PathSensitive
import org.gradle.api.tasks.PathSensitivity

interface HardenedJnaParameters extends TransformParameters {
    @InputDirectory @PathSensitive(PathSensitivity.RELATIVE)
    DirectoryProperty getPreparedDirectory()
}

@CacheableTransform
abstract class HardenedJnaTransform implements TransformAction<HardenedJnaParameters> {
    @InputArtifact @PathSensitive(PathSensitivity.NONE)
    abstract Provider<FileSystemLocation> getInputArtifact()

    static String sha256(byte[] bytes) {
        MessageDigest.getInstance('SHA-256').digest(bytes).encodeHex().toString()
    }

    static void ensure(boolean valid, String message) {
        if (!valid) throw new GradleException("JNA hardening: $message")
    }

    static Map<String, String> resources(ZipFile archive) {
        def result = [:]
        archive.entries().each { entry ->
            if (!entry.name.startsWith('jni/')) {
                ensure(!result.containsKey(entry.name), 'Duplicate resource entry')
                result[entry.name] = archive.getInputStream(entry).withCloseable { sha256(it.bytes) }
            }
        }
        result
    }

    static File verifiedArtifact(File original, File directory) {
        def manifest = new JsonSlurper().parse(new File(directory, 'manifest.json'))
        ensure(manifest.schema == 1, 'Unsupported provenance schema')
        def version = original.name.substring(4, original.name.length() - 4)
        ensure(manifest.coordinate == "net.java.dev.jna:jna:$version", 'JNA version mismatch')
        ensure(manifest.upstream_filename == original.name, 'Upstream filename mismatch')
        ensure(manifest.filename == "jna-$version-hardened.aar", 'Prepared filename mismatch')
        ensure(manifest.native_version instanceof String &&
            manifest.native_version ==~ /[0-9]+\.[0-9]+\.[0-9]+/, 'Invalid native API version')
        ensure(sha256(original.bytes) == manifest.upstream_sha256, 'Upstream JNA AAR checksum mismatch')
        def prepared = new File(directory, manifest.filename as String)
        ensure(sha256(prepared.bytes) == manifest.sha256, 'Prepared JNA AAR checksum mismatch')
        new ZipFile(original).withCloseable { upstream ->
            new ZipFile(prepared).withCloseable { hardened ->
                def originalResources = resources(upstream)
                ensure(originalResources['classes.jar'] == manifest.classes_sha256, 'Java checksum mismatch')
                ensure(resources(hardened) == originalResources, 'Java or resource bytes changed')
                def expected = ['arm64-v8a', 'x86_64'].collect { "jni/$it/libjnidispatch.so".toString() } as Set
                def names = hardened.entries().collect { it.name }.findAll { it.startsWith('jni/') }
                ensure(names.size() == 2 && names.toSet() == expected, 'Unexpected JNI payload inventory')
                ensure(manifest.native_sha256 instanceof Map &&
                    manifest.native_sha256.keySet() == ['arm64-v8a', 'x86_64'].toSet(), 'Invalid JNI hashes')
                expected.each { name ->
                    def bytes = hardened.getInputStream(hardened.getEntry(name)).withCloseable { it.bytes }
                    ensure(sha256(bytes) == manifest.native_sha256[name.split('/')[1]], 'JNI checksum mismatch')
                }
            }
        }
        prepared
    }

    @Override void transform(TransformOutputs outputs) {
        def original = inputArtifact.get().asFile
        if (!original.name.startsWith('jna-') || !original.name.endsWith('.aar')) {
            outputs.file(original)
            return
        }
        def prepared = verifiedArtifact(original, parameters.preparedDirectory.get().asFile)
        Files.copy(prepared.toPath(), outputs.file(original.name).toPath())
    }
}

def hardened = Attribute.of('dyapp.jna.hardened', Boolean)
def preparedDirectory = file(providers.gradleProperty('dyapp.jnaNativeDir')
    .orElse('/opt/dyapp/jna-native').get())
dependencies.artifactTypes.maybeCreate('aar').attributes.attribute(hardened, false)
dependencies.registerTransform(HardenedJnaTransform) {
    from.attribute(ArtifactTypeDefinition.ARTIFACT_TYPE_ATTRIBUTE, 'aar').attribute(hardened, false)
    to.attribute(ArtifactTypeDefinition.ARTIFACT_TYPE_ATTRIBUTE, 'aar').attribute(hardened, true)
    parameters.preparedDirectory.set(preparedDirectory)
}
configurations.configureEach {
    attributes.attribute(hardened, true)
}
