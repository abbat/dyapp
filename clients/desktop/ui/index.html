<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title data-i18n="app.name"></title>
  <style>
    body { font: 18px system-ui, sans-serif; margin: 0; }
    main { max-width: 960px; margin: auto; padding: 3rem 1.5rem; text-align: center; }
    #setup { max-width: 640px; margin-inline: auto; }
    button { display: block; width: 100%; margin: 1rem 0; padding: .8rem; font: inherit; }
    button:disabled { opacity: .5; }
    .notice { font-size: .9rem; }
    #peer-id, #key-path, #identities, #settings-identities,
    #recovery-peer, #remove-peer, #remove-path {
      overflow-wrap: anywhere;
    }
    #identities, #settings-identities { list-style: none; padding: 0; }
    #network { text-align: start; }
    #network label { display: block; margin-top: 1rem; }
    #seeds, #network-name { box-sizing: border-box; width: 100%; font: inherit; }
    #seed-rows { overflow-wrap: anywhere; }
    #profile { text-align: start; }
    #profile label { display: block; margin-top: 1rem; }
    #profile select, #profile input[type=number] { width: 100%; box-sizing: border-box; font: inherit; }
    #profile-preview { text-align: start; overflow-wrap: anywhere; }
    #profile-preview ul { padding-inline-start: 1.5rem; }
  </style>
</head>
<body>
  <main>
    <h1 data-i18n="app.name"></h1>
    <p id="app-ready" role="status" data-i18n="status.loading"></p>
    <section id="setup" hidden>
      <h2 data-i18n="storage.title"></h2>
      <button id="system-choice" type="button" data-i18n="storage.system.choice"></button>
      <p id="system-reason" class="notice" role="status"></p>
      <button id="file-choice" type="button" data-i18n="storage.file.choice"></button>
      <p class="notice" data-i18n="storage.file.warning"></p>
    </section>
    <section id="identity" hidden>
      <p data-i18n="storage.peerId"></p>
      <p id="peer-id"></p>
      <button id="settings-open" type="button" data-i18n="settings.title"></button>
      <div id="file-backup" hidden>
        <p data-i18n="storage.file.backup"></p>
        <p><code id="key-path"></code></p>
      </div>
      <form id="network" novalidate>
        <h2 data-i18n="network.title"></h2>
        <label for="seeds" data-i18n="network.seeds"></label>
        <textarea id="seeds" rows="3" spellcheck="false"></textarea>
        <label for="network-name" data-i18n="network.name"></label>
        <input id="network-name" spellcheck="false">
        <button id="check-connection" type="submit" data-i18n="network.check"></button>
        <button id="cancel-check" type="button" data-i18n="network.cancel" hidden></button>
        <button id="continue-connection" type="button" data-i18n="network.continue"
          disabled></button>
        <p id="network-status" role="status"></p>
        <ol id="seed-rows"></ol>
      </form>
      <form id="profile" novalidate>
        <h2 data-i18n="profile.title"></h2>
        <div id="profile-scales"></div>
        <label for="birth-year" data-i18n="profile.birthYear"></label>
        <input id="birth-year" type="number" min="1" max="9999">
        <label for="birth-month" data-i18n="profile.birthMonth"></label>
        <input id="birth-month" type="number" min="1" max="12">
        <label for="birth-day" data-i18n="profile.birthDay"></label>
        <input id="birth-day" type="number" min="1" max="31">
        <button id="profile-save" type="submit" data-i18n="profile.save"></button>
        <button id="profile-preview-action" type="button" data-i18n="profile.previewAction"></button>
        <section id="profile-preview" hidden>
          <h3 data-i18n="profile.previewTitle"></h3>
          <ul id="profile-public-fields"></ul>
          <p id="profile-age"></p>
          <p class="notice" data-i18n="profile.copyWarning"></p>
          <p id="profile-date-warning" class="notice" data-i18n="profile.fullDateWarning" hidden></p>
          <label><input id="profile-disclosure" type="checkbox">
            <span data-i18n="profile.disclosure"></span></label>
        </section>
        <label><input id="profile-attested" type="checkbox">
          <span data-i18n="profile.attested"></span></label>
        <button id="profile-publish" type="button" data-i18n="profile.publish"></button>
        <button id="profile-cancel" type="button" data-i18n="profile.cancel" hidden></button>
        <p id="profile-status" role="status"></p>
      </form>
    </section>
    <section id="settings" hidden>
      <h2 data-i18n="settings.title"></h2>
      <p data-i18n="settings.identities"></p>
      <ul id="settings-identities"></ul>
      <p id="settings-error" role="alert" hidden></p>
      <button id="settings-create" type="button" data-i18n="identity.add"></button>
      <button id="settings-switch" type="button" data-i18n="identity.switch"></button>
      <button id="settings-back" type="button" data-i18n="settings.back"></button>
    </section>
    <section id="picker" hidden>
      <ul id="identities"></ul>
      <button id="add-identity" type="button" data-i18n="identity.add"></button>
    </section>
    <section id="recovery" hidden>
      <p id="recovery-reason"></p>
      <p id="recovery-peer"></p>
      <button id="retry" type="button" data-i18n="recovery.retry"></button>
    </section>
    <section id="remove" hidden>
      <h2 data-i18n="remove.title"></h2>
      <p id="remove-peer"></p>
      <p id="remove-mode"></p>
      <p id="remove-path" hidden><code></code></p>
      <p id="remove-copies"></p>
      <p id="remove-warning" class="notice" data-i18n="remove.warning"></p>
      <label><input id="remove-confirm" type="checkbox">
        <span data-i18n="remove.confirm"></span></label>
      <button id="remove-action" type="button" data-i18n="remove.action" disabled></button>
      <button id="remove-cancel" type="button" data-i18n="remove.cancel"></button>
    </section>
    <button id="remove-identity" type="button" data-i18n="identity.remove" hidden></button>
    <button id="switch-identity" type="button" data-i18n="identity.switch" hidden></button>
    <p id="storage-error" role="alert" hidden></p>
  </main>
  <script src="app.js"></script>
</body>
</html>
