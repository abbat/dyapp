[package]
name = "dyapp-linux"
version = "0.0.1"
edition = "2021"
rust-version = "1.99"

[dependencies]
tauri = { version = "=2.12.3", features = [] }
dyapp-identity = { path = "../../rust/identity" }
secret-service = { version = "=5.2.0", default-features = false, features = [
    "rt-tokio-crypto-rust",
] }
zeroize = "1.9"

[build-dependencies]
tauri-build = { version = "=2.7.2", features = [] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[lints.rust]
unsafe_code = "forbid"
