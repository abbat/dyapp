[package]
name = "dyapp-linux"
version = "0.0.1"
edition = "2021"
rust-version = "1.99"

[dependencies]
tauri = { version = "=2.12.3", features = ["tray-icon"] }
tauri-plugin-clipboard-manager = "=2.5.0"
dyapp-bootstrap = { path = "../../rust/bootstrap" }
dyapp-client = { path = "../../rust/client" }
dyapp-identity = { path = "../../rust/identity" }
dyapp-p2p-net = { path = "../../rust/p2p-net" }
dyapp-profile = { path = "../../rust/profile" }
qrcodegen = "=1.8.0"
quircs = "=0.10.3"
dbus-secret-service = { version = "=4.1.0", features = ["crypto-rust"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt", "sync"] }
zbus = { version = "=6.2.1", default-features = false, features = ["proxy", "service", "tokio"] }
zeroize = "1.9"
image = { version = "=0.25.10", default-features = false, features = ["jpeg", "png"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt", "time"] }

[build-dependencies]
tauri-build = { version = "=2.7.2", features = [] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[lints.rust]
unreachable_pub = "deny"
unfulfilled_lint_expectations = "deny"
unsafe_code = "forbid"

[lints.clippy]
assert_is_empty = "deny"
cognitive_complexity = "warn"
too_many_lines = "warn"
excessive_nesting = "warn"
allow_attributes = "deny"
allow_attributes_without_reason = "deny"

# Argon2 runs at release speed in debug and test builds, as in the root workspace: the UI smoke
# solves a profile puzzle of thousands of hashes.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package.argon2]
opt-level = 3
[profile.dev.package.blake2]
opt-level = 3
[profile.test.package.argon2]
opt-level = 3
[profile.test.package.blake2]
opt-level = 3
