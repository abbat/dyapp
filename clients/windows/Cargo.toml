[package]
name = "dyapp-windows"
version = "0.0.1"
edition = "2021"
rust-version = "1.99"

[dependencies]
tauri = { version = "=2.12.3", features = [] }
dyapp-identity = { path = "../../rust/identity" }
keyring-core = "=1.0.0"
windows-native-keyring-store = "=1.1.0"
zeroize = "1.9"

[build-dependencies]
tauri-build = { version = "=2.7.2", features = [] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[lints.rust]
unsafe_code = "forbid"
