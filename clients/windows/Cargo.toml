[package]
name = "dyapp-windows"
version = "0.0.1"
edition = "2021"
rust-version = "1.99"

[dependencies]
tauri = { version = "=2.12.3", features = ["tray-icon"] }
tauri-plugin-clipboard-manager = "=2.5.0"
tauri-plugin-single-instance = "=2.5.5"
dyapp-client = { path = "../../rust/client" }
dyapp-bootstrap = { path = "../../rust/bootstrap" }
dyapp-identity = { path = "../../rust/identity" }
dyapp-p2p-net = { path = "../../rust/p2p-net" }
dyapp-profile = { path = "../../rust/profile" }
image = { version = "=0.25.10", default-features = false, features = ["jpeg", "png"] }
qrcodegen = "=1.8.0"
quircs = "=0.10.3"
keyring-core = "=1.0.1"
windows-native-keyring-store = "=1.1.0"
# Already in the lock through Tauri: the network cost for media auto-download, and the toasts.
windows = { version = "=0.62.2", features = [
    "Data_Xml_Dom",
    "Foundation_Collections",
    "Networking_Connectivity",
    "UI_Notifications",
] }
# Names the portable app's toast identity under the user's registry key.
windows-registry = "=0.6.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "sync"] }
zeroize = "1.9"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt", "time"] }

[build-dependencies]
tauri-build = { version = "=2.7.2", features = [] }

[features]
ui-smoke = []
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[lints.rust]
unreachable_pub = "deny"
unfulfilled_lint_expectations = "deny"
unsafe_code = "forbid"

[lints.clippy]
large_futures = "deny"
assert_is_empty = "deny"
assigning_clones = "deny"
bool_to_int_with_if = "deny"
cast_lossless = "deny"
cast_possible_truncation = "deny"
cast_possible_wrap = "deny"
cast_sign_loss = "deny"
default_trait_access = "deny"
doc_markdown = "deny"
format_collect = "deny"
match_wildcard_for_single_variants = "deny"
similar_names = "deny"
struct_excessive_bools = "deny"
struct_field_names = "deny"
ignored_unit_patterns = "deny"
implicit_clone = "deny"
manual_string_new = "deny"
needless_pass_by_value = "deny"
map_unwrap_or = "deny"
redundant_closure_for_method_calls = "deny"
uninlined_format_args = "deny"
unreadable_literal = "deny"
wildcard_imports = "deny"
allow_attributes = "deny"
allow_attributes_without_reason = "deny"

# Argon2 runs at release speed in debug and test builds, as in the root workspace: the UI smoke
# solves a profile puzzle of thousands of hashes.
[profile.dev.package.argon2]
opt-level = 3
[profile.dev.package.blake2]
opt-level = 3
[profile.test.package.argon2]
opt-level = 3
[profile.test.package.blake2]
opt-level = 3
