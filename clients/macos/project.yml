name: DYApp
options:
  minimumXcodeGenVersion: 2.44.1
  developmentLanguage: en
  deploymentTarget:
    macOS: "11.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    CODE_SIGNING_ALLOWED: "NO"
    GENERATE_INFOPLIST_FILE: YES
    MARKETING_VERSION: "0.0.1"
    CURRENT_PROJECT_VERSION: "1"
targets:
  DYApp:
    type: application
    platform: macOS
    sources: [src/App.swift, ../ios/DYApp/ContentView.swift, ../ios/DYApp/RustBridge.swift,
              ../ios/DYApp/PlatformKeyStore.swift,
              ../ios/DYApp/Localizable.xcstrings, ../../build/apple/swift/dyapp.swift]
    dependencies:
      # Built by scripts/build-apple-core.sh before XcodeGen runs.
      - framework: ../../build/apple/DyappFFI.xcframework
        embed: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.dyapp.macos
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
  DYAppTests:
    type: bundle.unit-test
    platform: macOS
    sources: [Tests/AppTests.swift]
    dependencies:
      - target: DYApp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.dyapp.macos.tests
  DYAppUITests:
    type: bundle.ui-testing
    platform: macOS
    sources: [UITests]
    dependencies:
      - target: DYApp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.dyapp.macos.uitests
schemes:
  DYApp:
    build:
      targets:
        DYApp: all
    test:
      targets:
        - DYAppTests
        - DYAppUITests
      gatherCoverageData: true
