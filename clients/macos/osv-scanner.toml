[[IgnoredVulns]]
id = "RUSTSEC-2024-0429"
reason = "glib 0.18 belongs to Tauri's GTK/WebKitGTK backend, whose dependency edges are Linux/BSD-only; native macOS builds use AppKit/WebKit and do not compile glib"
ignoreUntil = 2026-12-08

