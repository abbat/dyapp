name: DYApp
options:
  minimumXcodeGenVersion: 2.44.1
  developmentLanguage: en
  deploymentTarget:
    iOS: "15.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_TREAT_WARNINGS_AS_ERRORS: YES
    SWIFT_STRICT_CONCURRENCY: complete
    CODE_SIGNING_ALLOWED: "NO"
    GENERATE_INFOPLIST_FILE: YES
    MARKETING_VERSION: "0.0.1"
    CURRENT_PROJECT_VERSION: "1"
targets:
  DYApp:
    type: application
    platform: iOS
    sources: [DYApp/App.swift, DYApp/ContentView.swift, DYApp/IdentitySettingsView.swift,
              DYApp/NetworkDraftView.swift, DYApp/NetworkConnectionSession.swift,
              DYApp/ProfileDraftView.swift, DYApp/PeerPhotos.swift, DYApp/PhotoPrep.swift, DYApp/ProfilePhotos.swift, DYApp/ProfileRustDraftStore.swift, DYApp/PlacePicker.swift,
              DYApp/ProfileSolveSession.swift, DYApp/ProfileProofControls.swift, DYApp/RustBridge.swift,
              DYApp/PlatformKeyStore.swift, DYApp/IdentitySlotStore.swift, DYApp/AppLockStore.swift, DYApp/LockGate.swift,
              DYApp/LockScreens.swift, DYApp/ProfilePreviewView.swift, DYApp/ProfileExtraFields.swift,
              DYApp/SearchFilters.swift, DYApp/SearchSession.swift, DYApp/SearchView.swift, DYApp/FoundProfileView.swift, DYApp/ProfilePage.swift, DYApp/ProfilePageBlocks.swift,
              DYApp/MailNoticeCore.swift, DYApp/MailJob.swift, DYApp/ChatBridge.swift, DYApp/ChatFeed.swift, DYApp/ChatsView.swift, DYApp/ChatView.swift, DYApp/ChatRename.swift, DYApp/SafetyNumber.swift, DYApp/PeopleSettings.swift, DYApp/UpdatesSection.swift, DYApp/ChatTestPeer.swift,
              DYApp/Localizable.xcstrings,
              DYApp/Assets.xcassets,
              ../../build/apple/swift/dyapp.swift]
    dependencies:
      # Built by tools/scripts/build-apple-core.sh before XcodeGen runs.
      - framework: ../../build/apple/DyappFFI.xcframework
        embed: false
      # libp2p in the static core reads network state through SystemConfiguration.
      - sdk: SystemConfiguration.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.dyapp.ios
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # What the generated file cannot hold: the background receive's permission.
        INFOPLIST_FILE: DYApp/Info.plist
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        # The device-owner check that recovers a forgotten app PIN may use Face ID.
        INFOPLIST_KEY_NSFaceIDUsageDescription: "Face ID unlocks the app."
  DYAppTests:
    type: bundle.unit-test
    platform: iOS
    sources: [Tests]
    dependencies:
      - target: DYApp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.dyapp.ios.tests
  DYAppUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [UITests]
    dependencies:
      - target: DYApp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.dyapp.ios.uitests
schemes:
  DYApp:
    build:
      targets:
        DYApp: all
    test:
      targets:
        - DYAppTests
        - DYAppUITests
      gatherCoverageData: true
