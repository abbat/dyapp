syntax = "proto3";

package dyapp.profile;

import "identity.proto";

// Public profile, the payload of a `SignedRecord` signed by the owner's identity key.
// Every field is public. Empty strings, zero scales and unset optionals mean "not published".
message Profile {
  // Starts at 1; increasing versions are subject to the signed previous-state fence when present.
  uint64 version = 1;
  // Tombstone: every other field except proof of work and protected publication metadata is empty.
  bool deleted = 2;
  // Retired before the first release; never reuse this field number.
  reserved 3;
  // ISO 3166-1 alpha-2 code; income is compared only within one country.
  string country = 4;
  // Held coordinates.
  reserved 5;
  // Free income range, no currency or brackets.
  optional uint64 income_from = 6;
  optional uint64 income_to = 7;
  optional bool has_kids = 8;
  optional bool wants_more_kids = 9;
  // Retired free-text categorical fields; replaced by numeric scales below.
  reserved 10, 11, 12, 13, 14, 15, 16, 17, 18;
  repeated string interests = 19;
  // `GeoNames` ID (decimal) of a cities1000 place in `country`, no coordinates; matched exactly.
  // A search node indexes any other value under the country only.
  string place = 20;
  repeated Photo photos = 21;
  // Argon2id proof of work over the signer's key, see docs/architecture/bootstrap.md
  // "Proof of work". Missing = 0 bits.
  uint64 pow_nonce = 22;
  uint32 pow_bits = 23;
  // Current identity-certified devices, sorted by SHA-256 of the device key; at most 64.
  repeated dyapp.identity.SignedRecord devices = 24;
  // Retired free-text gender.
  reserved 25;
  // Optional public name, at most 64 characters; never proof of identity:
  // clients show it with the verified or unverified mark, and a contact's local name replaces it.
  string name = 26;
  // Highest education, ordered so "at least" is a range: 0 not published, 10 secondary school,
  // 20 vocational or college, 30 bachelor, 40 specialist (a single 5-6 year degree, between
  // bachelor and master), 50 master, 60 doctorate. Treated like the closed scales below.
  uint32 education_level = 27;
  // Optional free text for local compatibility scoring; not indexed for search.
  string profession = 28;
  string company = 29;
  string industry = 30;
  string career_stage = 31;
  string work_life_balance = 32;
  // Optional public birth-date parts. Each can be absent independently; no year means unknown age.
  // A day without a month is allowed, but must occur in a possible Gregorian date.
  optional uint32 birth_year = 33;
  optional uint32 birth_month = 34;
  optional uint32 birth_day = 35;
  // Closed scales defined by rust/profile. Zero means not published for every field.
  // A client publishes only values it knows; a code above a scale's maximum, from a newer client,
  // still verifies and counts as not stated in search. See ADR 0028.
  uint32 gender = 36;
  uint32 orientation = 37;
  uint32 relationship_goal = 38;
  uint32 role_preference = 39;
  uint32 career_ambition = 40;
  uint32 financial_philosophy = 41;
  uint32 employment_status = 42;
  uint32 fitness_level = 43;
  // Self-declared sign, independent of the published birth date.
  uint32 zodiac = 44;
  // The binding each listed device signed, accepting this identity as the owner that may close
  // its mailbox, see docs/architecture/bootstrap.md. At most one per entry of `devices`.
  repeated dyapp.identity.SignedRecord device_owners = 45;
  // Whole centimetres, 50-272 inclusive; absent when not published. Unlike the scales, verification
  // refuses a value outside the range.
  optional uint32 height = 46;
  // Plain text about the owner, at most 500 code points; line feeds allowed. Not indexed for search.
  string about = 47;
  // Closed scales; zero means not published.
  uint32 smoking = 48;
  uint32 drinking = 49;
  uint32 tattoos = 50;
  uint32 marital_status = 51;
  uint32 pets = 52;
  // `Gender` codes the owner is looking for, without zero or repeats, at most 16.
  repeated uint32 seeking_genders = 53;
  // Partner age bounds the owner is looking for, each 18 to 120, from not above to.
  optional uint32 seeking_age_from = 54;
  optional uint32 seeking_age_to = 55;
  // The owner is not looking now, and so states none of the three fields above.
  bool not_looking = 56;
  // Protected publication metadata, never an editable field. Covered by `ProfileConditional`'s
  // signature; removing it cannot turn this record into a legacy profile authorization.
  ProfileCondition previous = 57;
  // Protected search withdrawal purpose; only a tombstone without an ordinary previous-state fence.
  // Signed in the search-withdrawal domain and never ordinary profile-storage authorization.
  bool search_only = 58;
}

// The ordinary profile observed before authorizing a write. Zero/empty means no profile.
// Replacements refuse a newer current version or a different record at this version.
// Missing/older replicas may seed the target; this is a per-replica fence, not global consensus.
message ProfileCondition {
  uint64 version = 1;
  // SHA-256 of the complete encoded `SignedRecord`, including its original signed payload.
  bytes record_hash = 2;
}

// Signed by the owner's identity key under dyapp/device-certificate/v1\0.
message DeviceCertificate {
  // Ed25519 key for the device mailbox, distinct from the identity and MLS keys.
  bytes device_key = 1;
  // Ed25519 MLS leaf signature key.
  bytes mls_signature_key = 2;
  // Increasing when a device replaces either key; starts at 1.
  uint64 generation = 3;
}

// A photo as `/dyapp/media` blobs, each named by the SHA-256 of its data. Lists and search results
// load only the thumbnail; the full image loads when the profile is opened.
message Photo {
  // The full image in order, split into blobs no larger than the node's `max_media_bytes`.
  repeated bytes full = 1;
  // One small blob, stored whole: a JPEG, long side at most 320 px, at most 24 KiB, made and
  // checked by `make_preview` and `check_preview` in `rust/ffi`.
  bytes thumbnail = 2;
}
