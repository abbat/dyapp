syntax = "proto3";

package dyapp.profile;

import "identity.proto";

// Public profile, the payload of a `SignedRecord` signed by the owner's identity key.
// Every field is public. Empty strings, zero scales and unset optionals mean "not published".
message Profile {
  // Starts at 1; the highest validly signed version wins.
  uint64 version = 1;
  // Tombstone: every other field except the proof of work is empty.
  bool deleted = 2;
  // Retired before the first release; never reuse this field number.
  reserved 3;
  // ISO 3166-1 alpha-2 code; income is compared only within one country.
  string country = 4;
  // Held coordinates.
  reserved 5;
  // Free income range, no currency or brackets.
  optional uint64 income_from = 6;
  optional uint64 income_to = 7;
  optional bool has_kids = 8;
  optional bool wants_more_kids = 9;
  // Retired free-text categorical fields; replaced by numeric scales below.
  reserved 10, 11, 12, 13, 14, 15, 16, 17, 18;
  repeated string interests = 19;
  // GeoNames ID (decimal) of a cities1000 place in `country`, no coordinates; matched exactly.
  // A search node indexes any other value under the country only.
  string place = 20;
  repeated Photo photos = 21;
  // Argon2id proof of work over the signer's key, see docs/architecture/bootstrap.md
  // "Proof of work". Missing = 0 bits.
  uint64 pow_nonce = 22;
  uint32 pow_bits = 23;
  // Current identity-certified devices, sorted by SHA-256 of the device key; at most 64.
  repeated dyapp.identity.SignedRecord devices = 24;
  // Retired free-text gender.
  reserved 25;
  // Optional public name, at most 64 characters; never proof of identity:
  // clients show it with the verified or unverified mark, and a contact's local name replaces it.
  string name = 26;
  // Highest education, ordered so "at least" is a range: 0 not published, 1 secondary school,
  // 2 vocational or college, 3 bachelor, 4 specialist (a single 5-6 year degree, between
  // bachelor and master), 5 master, 6 doctorate. Above 6 is rejected.
  uint32 education_level = 27;
  // Optional free text for local compatibility scoring; not indexed for search.
  string profession = 28;
  string company = 29;
  string industry = 30;
  string career_stage = 31;
  string work_life_balance = 32;
  // Optional public birth-date parts. Each can be absent independently; no year means unknown age.
  // A day without a month is allowed, but must occur in a possible Gregorian date.
  optional uint32 birth_year = 33;
  optional uint32 birth_month = 34;
  optional uint32 birth_day = 35;
  // Closed scales defined by rust/profile. Zero means not published for every field.
  // Values above each scale's maximum are rejected by validation.
  uint32 gender = 36;
  uint32 orientation = 37;
  uint32 relationship_goal = 38;
  uint32 role_preference = 39;
  uint32 career_ambition = 40;
  uint32 financial_philosophy = 41;
  uint32 employment_status = 42;
  uint32 fitness_level = 43;
  // Self-declared sign, independent of the published birth date.
  uint32 zodiac = 44;
}

// Signed by the owner's identity key under dyapp/device-certificate/v1\0.
message DeviceCertificate {
  // Ed25519 key for the device mailbox, distinct from the identity and MLS keys.
  bytes device_key = 1;
  // Ed25519 MLS leaf signature key.
  bytes mls_signature_key = 2;
  // Increasing when a device replaces either key; starts at 1.
  uint64 generation = 3;
}

// A photo as `/dyapp/media` blobs, each named by the SHA-256 of its data. Lists and search results
// load only the thumbnail; the full image loads when the profile is opened.
message Photo {
  // The full image in order, split into blobs no larger than the node's `max_media_bytes`.
  repeated bytes full = 1;
  // One small blob, stored whole: a JPEG, long side at most 320 px, at most 24 KiB, made and
  // checked by `make_preview` and `check_preview` in `rust/ffi`.
  bytes thumbnail = 2;
}
