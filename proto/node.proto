syntax = "proto3";

package dyapp.node;

import "identity.proto";

// Node protocol: one libp2p request-response protocol per service, named in each section.
// Protocol IDs carry no version. Messages evolve only by new fields; a node that gets a request
// variant it does not know answers STATUS_UNSUPPORTED.
//
// Identifiers on the wire are raw bytes:
// - peer ID of an identity: SHA-256 of the identity public key (32 bytes);
// - mailbox address: SHA-256 of the device public key (32 bytes).

enum Status {
  // Not set: a malformed reply.
  STATUS_UNSPECIFIED = 0;
  STATUS_OK = 1;
  STATUS_NOT_FOUND = 2;
  // A publish whose version is not newer than the stored one.
  STATUS_STALE = 3;
  STATUS_TOO_LARGE = 4;
  // Store or pending-write limit, or no second distinct holder within the write deadline;
  // try another replica.
  STATUS_FULL = 5;
  STATUS_RATE_LIMITED = 6;
  // Bad signature or wrong key.
  STATUS_DENIED = 7;
  STATUS_UNSUPPORTED = 8;
  STATUS_INVALID = 9;
  // The operator's deny list names the peer, its IP group or a key in the request; try another
  // replica.
  STATUS_REFUSED = 10;
  // A search query or get without a valid puzzle solution while the node is loaded; retry with
  // `puzzle` solved for `puzzle_challenge` and `puzzle_bits`.
  STATUS_PUZZLE = 11;
}

enum Role {
  ROLE_UNSPECIFIED = 0;
  ROLE_STORE = 1;
  ROLE_MEDIA = 2;
  ROLE_SEARCH = 3;
  ROLE_TURN = 4;
}

// ---- /dyapp/node: every node ----

message NodeRequest {
  oneof request {
    InfoRequest info = 1;
    // Nodes older than deny-list exchange answer UNSUPPORTED; a node whose operator does not
    // share the list answers NOT_FOUND.
    DenyListRequest deny_list = 2;
    // Nodes without the turn role, and older nodes, answer UNSUPPORTED.
    TurnRequest turn = 3;
  }
}

message InfoRequest {}

// Asks for the operator's deny list, which the asking node only stores.
message DenyListRequest {}

// Asks for short-lived credentials on the node's TURN relay.
message TurnRequest {}

message NodeResponse {
  Status status = 1;
  NodeInfo info = 2;
  // deny_list: payload `DenyList`, signed by the node's Ed25519 libp2p key.
  dyapp.identity.SignedRecord deny_list = 3;
  TurnCredentials turn = 4;
}

// TURN REST credentials (coturn `use-auth-secret`): username `<expires>:<peer id>`, password
// base64(HMAC-SHA1(shared secret, username)).
message TurnCredentials {
  string username = 1;
  string password = 2;
  // `turn:` / `turns:` URLs of the relay.
  repeated string urls = 3;
  // Unix seconds after which the relay refuses the credentials.
  uint64 expires = 4;
}

// Entries in the deny list's stored form, without the operator's notes.
message DenyList {
  // Unix seconds when the list was signed; a newer list from the same node replaces an older one.
  uint64 time = 1;
  repeated string entries = 2;
}

// What the node serves and accepts. Zero limits mean "no such limit" or "role not served".
message NodeInfo {
  repeated Role roles = 1;
  uint64 max_profile_bytes = 2;
  uint64 max_message_bytes = 3;
  uint64 max_mailbox_bytes = 4;
  uint64 max_media_bytes = 5;
  // Minimum proof-of-work difficulty of a profile key, in leading zero bits.
  uint32 min_profile_pow = 6;
  uint64 retention_seconds = 7;
  // Profile field numbers a search node filters on; empty without the search role.
  repeated uint32 search_fields = 8;
  // Largest profile record a search node indexes, in bytes.
  uint64 max_search_profile_bytes = 9;
  // Node clock in Unix seconds; 0 means not reported.
  uint64 server_time = 10;
  // Search puzzle difficulty in leading zero bits; 0 means queries and gets need no puzzle.
  uint32 puzzle_bits = 11;
  // The current search puzzle challenge, with the search role.
  bytes puzzle_challenge = 12;
  // Optional features this node serves beyond its roles; older nodes send none.
  repeated Capability capabilities = 13;
  // Minimum heartbeat proof-of-work difficulty on a search node, in leading zero bits.
  uint32 min_heartbeat_pow = 14;
  // Largest signed payload of a SIGNAL envelope; 0 without the store role or on older nodes.
  uint64 max_signal_bytes = 15;
  // Signal bytes kept per mailbox before the oldest are evicted; 0 as above.
  uint64 signal_quota_bytes = 16;
  // Tokenless message bytes kept per mailbox while write tokens are required; 0 as above.
  uint64 mailbox_pool_bytes = 17;
  // Tokenless messages go to the mailbox pool instead of the mailbox quota.
  bool require_write_tokens = 18;
}

// Every NodeInfo value is a hint from an untrusted node: a client never goes below its compiled
// floors because of it (docs/decisions/0016-protocol-evolution.md). A change that tightens
// security ships as a new oneof variant, which older nodes answer UNSUPPORTED.
enum Capability {
  CAPABILITY_UNSPECIFIED = 0;
  // `/dyapp/profile` heartbeat.
  CAPABILITY_PROFILE_HEARTBEAT = 1;
  // `/dyapp/search` load puzzle.
  CAPABILITY_SEARCH_PUZZLE = 2;
  // `/dyapp/node` deny_list answers with a signed list.
  CAPABILITY_SHARED_DENY_LIST = 3;
}

// ---- /dyapp/profile: store role ----

message ProfileRequest {
  oneof request {
    // A `SignedRecord` whose payload is a `dyapp.profile.Profile`, signed by its owner.
    dyapp.identity.SignedRecord publish = 1;
    GetProfile get = 2;
    // Payload `Heartbeat`, signed by the profile's owner. Nodes older than heartbeats answer
    // UNSUPPORTED.
    dyapp.identity.SignedRecord heartbeat = 3;
    // Node to node: checked like publish, stored locally and never forwarded.
    dyapp.identity.SignedRecord replica_put = 4;
    // Node to node: returns only the stored version, for presence-driven repair.
    GetProfile inventory = 5;
  }
}

message GetProfile {
  bytes peer_id = 1;
}

// The owner is active: the node keeps a profile for the retention period after the owner's last
// newer publish or fresh signed heartbeat. Replayed records and media requests do not count.
// A client sends one to the profile's replicas when the app opens. NOT_FOUND: publish it.
message Heartbeat {
  // Unix seconds; within 10 minutes of the node's clock, so a captured one soon goes stale.
  uint64 time = 1;
  // The owner's current profile version; a search node answers NOT_FOUND when it holds an older
  // one. Store nodes ignore it.
  uint64 version = 2;
  // Search nodes: an Argon2id proof for `pow_day` (8 MiB, 1 pass, 1 lane, salt
  // "dyapp-heartbeat-pow", password = key ‖ pow_day u32 BE ‖ pow_nonce u64 BE) with at least
  // NodeInfo.min_heartbeat_pow leading zero bits; `pow_day` = time / 86400. Store nodes ignore
  // them.
  uint64 pow_nonce = 3;
  uint32 pow_bits = 4;
  uint32 pow_day = 5;
}

message ProfileResponse {
  Status status = 1;
  // get: the stored record (the latest version or a tombstone);
  // publish answered STATUS_STALE: the stored, newer record.
  dyapp.identity.SignedRecord record = 2;
  // inventory: the stored version; STATUS_NOT_FOUND means no record.
  uint64 version = 3;
  // TOO_LARGE: the checked payload limit; 0 means not reported.
  uint64 max_bytes = 4;
  // INVALID caused by signed time: node clock in Unix seconds; 0 means not reported.
  uint64 server_time = 5;
}

// ---- /dyapp/mailbox: store role ----

message MailboxRequest {
  oneof request {
    ChallengeRequest challenge = 1;
    // Payload `Envelope`, signed by the sender's device key.
    dyapp.identity.SignedRecord put = 2;
    // Payload `Fetch`, signed by the mailbox's device key.
    dyapp.identity.SignedRecord fetch = 3;
    // Payload `Ack`, signed by the mailbox's device key.
    dyapp.identity.SignedRecord ack = 4;
    // An `ack` another replica node forwards verbatim: checked like `ack` but without the nonce,
    // and not forwarded again.
    dyapp.identity.SignedRecord replica_ack = 5;
    // Node to node, for repair: the ids the sending replica holds; the answer's `missing` lists
    // those this node lacks. Unsigned: it only names ids, envelopes move in `replica_put`.
    Inventory inventory = 6;
    // Node to node, for repair: envelopes as their senders signed them, each checked like `put`.
    Envelopes replica_put = 7;
    // Payload `Revoke`, signed by the mailbox's device key.
    dyapp.identity.SignedRecord revoke = 8;
    // A `revoke` another replica node forwards verbatim or repair carries: checked like `revoke`
    // and not forwarded again.
    dyapp.identity.SignedRecord replica_revoke = 9;
  }
}

message Inventory {
  bytes mailbox = 1;
  // At most 10 000 envelope ids.
  repeated bytes ids = 2;
}

message Envelopes {
  repeated dyapp.identity.SignedRecord envelopes = 1;
  // Unsigned per-mailbox sender labels set by the accepting node, parallel to `envelopes`; a
  // missing one is empty. At most 8 bytes each; a longer one is read as empty.
  repeated bytes source_groups = 2;
}

// Asks for a nonce bound to this libp2p connection, for one fetch or ack.
message ChallengeRequest {}

// One end-to-end encrypted message for one device. Stored once per id: a repeated put is a
// no-op, so puts need no nonce.
message Envelope {
  // 16 random bytes chosen by the sender.
  bytes id = 1;
  bytes mailbox = 2;
  // MLS ciphertext; the recipient checks the sender inside it.
  bytes ciphertext = 3;
  EnvelopeClass class = 4;
  // Payload `WriteToken` for this mailbox; the envelope is then signed by its `token_key`.
  // Unset for a first message to a stranger.
  dyapp.identity.SignedRecord write_token = 5;
}

// Lets one contact write to a mailbox for one UTC day, signed by the mailbox's device key. The
// owner hands it over inside MLS; a node sees only the per-day `token_key`.
message WriteToken {
  bytes mailbox = 1;
  // Ed25519 key that signs the contact's envelopes on that day.
  bytes token_key = 2;
  // UTC day: Unix seconds / 86400.
  uint32 epoch = 3;
}

// What a node may tell apart; anything else is end-to-end encrypted.
enum EnvelopeClass {
  // A message, also any value a node does not know.
  ENVELOPE_CLASS_MESSAGE = 0;
  // A like, a view or another signal: at most 1 KiB of signed payload, its own quota per
  // mailbox, the oldest evicted at the quota.
  ENVELOPE_CLASS_SIGNAL = 1;
}

// Reads the mailbox whose address is the hash of the signing key, oldest first.
message Fetch {
  bytes nonce = 1;
  // At most this many envelopes; the node may return fewer.
  uint32 limit = 2;
  // Push new envelopes over /dyapp/mailbox-push while this connection stays open.
  bool watch = 3;
}

// Deletes envelopes from the signer's mailbox. The node forwards the signed ack verbatim as
// `replica_ack` to the other replicas, which check the signature and the mailbox address but not
// the nonce.
message Ack {
  bytes nonce = 1;
  repeated bytes ids = 2;
}

// Write token keys the mailbox no longer accepts: the node deletes their stored envelopes and
// refuses their puts until `created_at` + 31 days + its message TTL + 1 hour. Needs no nonce: a
// replay only revokes the same keys again.
message Revoke {
  bytes mailbox = 1;
  // 1 to 64 keys, 32 bytes each.
  repeated bytes token_keys = 2;
  // Unix seconds; more than 1 hour ahead of the node's clock is DENIED.
  int64 created_at = 3;
}

message MailboxResponse {
  Status status = 1;
  // challenge: the nonce.
  bytes nonce = 2;
  // fetch: signed envelopes as the senders put them.
  repeated dyapp.identity.SignedRecord envelopes = 3;
  // fetch: more envelopes are waiting.
  bool more = 4;
  // inventory: listed ids this node does not hold.
  repeated bytes missing = 5;
  // TOO_LARGE: the checked envelope limit; 0 means not reported.
  uint64 max_bytes = 6;
}

// ---- /dyapp/mailbox-push: client, opened by the node after a fetch with `watch` ----

// Sent as soon as an envelope is stored, once per watching connection.
message MailboxPush {
  repeated dyapp.identity.SignedRecord envelopes = 1;
}

// The device still acknowledges with a mailbox ack.
message MailboxPushResponse {}

// ---- /dyapp/media: media role ----

// Media are content-addressed blobs: the hash is the SHA-256 of the data. A client splits a file
// larger than `max_media_bytes` into several blobs.
message MediaRequest {
  oneof request {
    // Payload `MediaKeep`, signed by the owner's identity key (the profile key).
    dyapp.identity.SignedRecord keep = 1;
    MediaPut put = 2;
    GetMedia get = 3;
    // Payload `MediaAttach`, signed by the sender's identity key. Nodes older than attachments
    // answer UNSUPPORTED.
    dyapp.identity.SignedRecord attach = 4;
    MediaRelease release = 5;
    // Node to node; receivers verify the owner's authorization independently.
    MediaReplicaPut replica_put = 6;
    MediaShardPut shard_put = 7;
    MediaShardGet shard_get = 8;
    // Node inventory, answered only to trusted peers near the replica keys.
    MediaHave have = 9;
  }
}

// The complete list of an owner's blobs. The node drops the owner's blobs not listed and accepts
// puts only of listed hashes, so a put needs no signature and a replayed put is harmless.
message MediaKeep {
  // Greater than the stored keep's version, or equal for a refresh with the same hashes.
  uint64 version = 1;
  repeated bytes hashes = 2;
  // Signed Unix seconds, within 10 minutes of the node clock. The same version and list
  // with a newer time refreshes retention without replacing the list.
  uint64 time = 3;
}

message MediaPut {
  // The owner's peer ID: the SHA-256 of the identity key, as in `GetProfile`.
  bytes owner = 1;
  bytes data = 2;
}

message MediaReplicaPut {
  // Exactly one of whole data or manifest; whole data is at most 1 MiB.
  bytes data = 1;
  MediaManifest manifest = 4;
  oneof authorization {
    dyapp.identity.SignedRecord keep = 2;
    dyapp.identity.SignedRecord attach = 3;
  }
}

// K = ceil(length / 1 MiB), M = 4; hashes are ordered by shard index.
message MediaManifest {
  bytes hash = 1;
  uint64 length = 2;
  repeated bytes shard_hashes = 3;
}

message MediaShardPut {
  MediaReplicaPut replica = 1;
  uint32 index = 2;
  bytes data = 3;
}

message MediaShardGet {
  bytes hash = 1;
  uint32 index = 2;
}

// No index names a whole copy or manifest; an index names a shard.
message MediaPart {
  bytes hash = 1;
  optional uint32 index = 2;
}

message MediaHave {
  repeated MediaPart items = 1;
}

message MediaInventory {
  repeated MediaPart present = 1;
  repeated MediaPart missing = 2;
  repeated MediaManifest manifests = 3;
  repeated bytes whole = 4;
}

message GetMedia {
  bytes hash = 1;
}

// Chat attachment blobs, end-to-end encrypted, put like listed blobs and counted against the
// sender's quota. The sender picks a random release secret per attachment and sends it to the
// recipient inside the message; the recipient releases the blobs after downloading them. Blobs
// never released go after the node's attachment retention, counted from `created`.
message MediaAttach {
  // SHA-256 of the release secret; one release covers all blobs of an attachment.
  bytes release = 1;
  repeated bytes hashes = 2;
  // Unix seconds; not more than 10 minutes ahead of the node's clock.
  uint64 created = 3;
}

message MediaRelease {
  // The secret whose SHA-256 a `MediaAttach` named.
  bytes secret = 1;
}

message MediaResponse {
  Status status = 1;
  // get: the blob.
  bytes data = 2;
  // keep: unrecoverable or unchecked hashes; attach: hashes not held locally.
  repeated bytes missing = 3;
  // have: no entries are returned for keys the requester may not inventory.
  MediaInventory inventory = 4;
  // TOO_LARGE: the checked blob, shard or authorization limit; 0 means not reported.
  uint64 max_bytes = 5;
  // INVALID caused by signed time: node clock in Unix seconds; 0 means not reported.
  uint64 server_time = 6;
}

// ---- /dyapp/search: search role ----

enum Op {
  OP_UNSPECIFIED = 0;
  OP_EQ = 1;
  // Up to 8 values; for a repeated field (interests): any of them.
  OP_IN = 2;
  // Two int values, inclusive.
  OP_RANGE = 3;
}

message Condition {
  // `dyapp.profile.Profile` field number.
  uint32 field = 1;
  Op op = 2;
  repeated int64 ints = 3;
  repeated string strings = 4;
}

message SearchQuery {
  // At most 16, one per field.
  repeated Condition conditions = 1;
  // 0 = 50, at most 200.
  uint32 limit = 2;
  // Required while the node asks for a puzzle (STATUS_PUZZLE).
  Puzzle puzzle = 3;
}

message SearchGet {
  // Key hashes, at most 50.
  repeated bytes keys = 1;
  // As in SearchQuery.
  Puzzle puzzle = 2;
}

// SHA-256("dyapp-search-puzzle" || challenge || peer ID as base58 text || nonce u64 BE) has at
// least the node's current puzzle bits leading zero bits. A challenge is current for a minute
// and accepted for one more; a solution is used once.
message Puzzle {
  bytes challenge = 1;
  uint64 nonce = 2;
}

message SearchRequest {
  oneof request {
    // A `SignedRecord` whose payload is a `dyapp.profile.Profile`, signed by its owner.
    dyapp.identity.SignedRecord publish = 1;
    // Payload `Heartbeat`, signed by the profile's owner.
    dyapp.identity.SignedRecord heartbeat = 2;
    SearchQuery query = 3;
    SearchGet get = 4;
  }
}

message SearchHit {
  // Key hash.
  bytes key = 1;
  uint64 version = 2;
}

message SearchResponse {
  Status status = 1;
  // Seconds, with RATE_LIMITED.
  uint64 retry_after = 2;
  repeated SearchHit hits = 3;
  // Condition fields the node applied.
  repeated uint32 applied = 4;
  // The scan budget ran out before `limit` hits.
  bool partial = 5;
  uint32 index_version = 6;
  // get: the stored records, cut at 1 MiB.
  repeated dyapp.identity.SignedRecord records = 7;
  // TOO_LARGE: the checked record limit; 0 means not reported.
  uint64 max_bytes = 8;
  // INVALID because profile PoW is below the node threshold; 0 means not reported.
  uint32 required_pow_bits = 9;
  // INVALID caused by signed time: node clock in Unix seconds; 0 means not reported.
  uint64 server_time = 10;
  // PUZZLE: the challenge and difficulty to solve.
  bytes puzzle_challenge = 11;
  uint32 puzzle_bits = 12;
}

// ---- /dyapp/inventory: search nodes catch up ----

message InventoryRequest {
  uint32 topic = 1;
  // Key hash; empty = from the start.
  bytes after = 2;
}

message InventoryResponse {
  Status status = 1;
  // Sorted by key, at most 10 000.
  repeated SearchHit have = 2;
}
