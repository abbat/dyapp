syntax = "proto3";

package dyapp;

/// Core network message types for P2P communication
/// All messages exchanged between peers use these definitions

// User profile message
message UserProfile {
  string user_id = 1;           // Unique user identifier
  string name = 2;              // User's display name
  bytes profile_data = 3;       // Encrypted profile (CRDT state)
  int64 timestamp = 4;          // Last update timestamp
  string signature = 5;         // Cryptographic signature
}

// Chat message between peers
message ChatMessage {
  string message_id = 1;        // Unique message identifier
  string from_user_id = 2;      // Sender's user ID
  string to_user_id = 3;        // Recipient's user ID
  bytes content = 4;            // Encrypted message content
  int64 timestamp = 5;          // Message timestamp
  string signature = 6;         // Cryptographic signature
}

// Sync request for CRDT state exchange
message SyncRequest {
  string peer_id = 1;           // Requesting peer
  string state_vector = 2;      // Current CRDT state
  repeated string crate_ids = 3; // Which CRDT clocks to sync
}

// Sync response with operations
message SyncResponse {
  string peer_id = 1;           // Responding peer
  bytes updates = 2;            // CRDT operations
  int64 lamport_clock = 3;      // Lamport timestamp
}

// Peer discovery announcement
message PeerAnnouncement {
  string peer_id = 1;           // Announcing peer's ID
  string public_key = 2;        // Peer's public key
  repeated string addresses = 3; // Network addresses (IP:port)
  int32 protocol_version = 4;   // Supported protocol version
  int64 timestamp = 5;          // Announcement time
}

// NAT traversal via TURN server
message TurnRequest {
  string from_peer = 1;         // Requesting peer
  string to_peer = 2;           // Target peer
  bytes data = 3;               // Relay data
}

// Match event between two users
message MatchEvent {
  string match_id = 1;          // Unique match identifier
  string user_a = 2;            // First user
  string user_b = 3;            // Second user
  float compatibility = 4;      // Compatibility score (0-1)
  int64 timestamp = 5;          // Match timestamp
}
