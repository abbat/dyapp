[package]
name = "dyapp-ffi"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true

[dependencies]
uniffi = { version = "0.32", features = ["cli"] }
dyapp-identity = { path = "../identity" }
dyapp-messaging = { path = "../messaging" }
dyapp-profile = { path = "../profile" }
dyapp-video = { path = "../video" }
image = { version = "0.25", default-features = false, features = ["jpeg"] }
prost.workspace = true
thiserror = "2"
tokio = { version = "1", features = ["sync", "rt"] }
zeroize = "1.9"

[build-dependencies]
uniffi = { version = "0.32", features = ["build"] }

[lib]
crate-type = ["cdylib", "rlib"]

[lints.rust]
missing_docs = "deny"

[lints.clippy]
# Practice C5: uniffi generates `#[no_mangle]`, so unsafe_code cannot be forbidden;
# hand-written unsafe blocks carry a `// SAFETY:` comment.
undocumented_unsafe_blocks = "deny"
