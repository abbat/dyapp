[package]
name = "dyapp-bootstrap"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true

[dependencies]
tokio = { version = "1", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = "0.3"
rusqlite = { version = "0.40", features = ["bundled"] }
uuid = { version = "1.0", features = ["v4"] }
chrono = "0.4"
prost.workspace = true
dyapp-identity = { path = "../identity" }
dyapp-profile = { path = "../profile" }
getrandom = "0.4"
libc = "0.2"

# Replication/erasure coding
reed-solomon-erasure = { version = "6.0", default-features = false }

# Rate limiting
governor = "0.10"

# Node config and the libp2p node
libp2p = { version = "0.57", features = ["ed25519"] }
toml = "1"
serde_ignored = "0.1"
dyapp-p2p-net = { path = "../p2p-net" }

[[test]]
name = "integration_tests"
path = "../../tests/integration_tests.rs"

[dev-dependencies]
proptest = "1.4"
dyapp-messaging = { path = "../messaging" }
dyapp-video = { path = "../video" }
