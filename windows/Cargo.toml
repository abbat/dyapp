[package]
name = "dyapp-windows"
version = "0.0.1"
edition = "2021"
rust-version = "1.99"

[dependencies]
tauri = { version = "=2.12.0", features = [] }
dyapp-identity = { path = "../rust/identity" }

[build-dependencies]
tauri-build = { version = "=2.7.1", features = [] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[lints.rust]
unsafe_code = "forbid"
