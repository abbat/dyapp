[workspace]
members = [
    "rust/identity",
    "rust/profile",
    "rust/p2p-net",
    "rust/messaging",
    "rust/client",
    "rust/video",
    "rust/bootstrap",
    "rust/ffi",
]
exclude = ["tests/fuzz", "clients/linux", "clients/windows"]
resolver = "2"

# Practice C5: no unsafe outside rust/bootstrap and rust/ffi (docs/development/code-quality.md).
[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "deny"

[workspace.package]
version = "0.0.1"
edition = "2021"
authors = ["Anton Batenev <antonbatenev@yandex.ru>"]
license = "MIT"
repository = "https://github.com/abbat/dyapp"
rust-version = "1.99"

[workspace.dependencies]
prost = "0.14"
prost-build = "0.14"
protox = "0.10"
proptest = "1.10"
proptest-derive = "0.9"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1

[profile.dev]
opt-level = 0

[profile.test]
opt-level = 0
debug = 0

# Argon2 runs at release speed in debug and test builds: profile PoW tests hash thousands of times.
[profile.dev.package.argon2]
opt-level = 3
[profile.dev.package.blake2]
opt-level = 3
[profile.test.package.argon2]
opt-level = 3
[profile.test.package.blake2]
opt-level = 3
