[workspace]
members = [
    "rust/identity",
    "rust/profile",
    "rust/p2p-net",
    "rust/messaging",
    "rust/video",
    "rust/bootstrap",
    "rust/ffi",
]
exclude = ["linux", "windows"]
resolver = "2"

[workspace.package]
version = "0.0.1"
edition = "2021"
authors = ["Anton Batenev <antonbatenev@yandex.ru>"]
license = "MIT"
repository = "https://github.com/abbat/dyapp"
rust-version = "1.99"

[workspace.dependencies]
prost = "0.14"
prost-build = "0.14"
protox = "0.9"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1

[profile.dev]
opt-level = 0

[profile.test]
opt-level = 0
debug = 0
