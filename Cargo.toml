[workspace]
members = [
    "rust/identity",
    "rust/profile",
    "rust/p2p-net",
    "rust/messaging",
    "rust/client",
    "rust/video",
    "rust/bootstrap",
    "rust/ffi",
]
exclude = ["tests/fuzz", "clients/linux", "clients/windows", "clients/macos"]
resolver = "2"

# Practice C5: no unsafe outside rust/bootstrap and rust/ffi (docs/development/code-quality.md).
[workspace.lints.rust]
unreachable_pub = "deny"
unfulfilled_lint_expectations = "deny"
unsafe_code = "forbid"
missing_docs = "deny"

[workspace.lints.clippy]
pedantic = { level = "deny", priority = -1 }
cognitive_complexity = "warn"
too_many_lines = "warn"
excessive_nesting = "warn"
allow_attributes = "deny"
allow_attributes_without_reason = "deny"
missing_errors_doc = "deny"
missing_panics_doc = "deny"
must_use_candidate = "deny"
doc_markdown = "deny"
assert_is_empty = "deny"
manual_assert_eq = "deny"
uninlined_format_args = "deny"
unreadable_literal = "deny"
wildcard_imports = "deny"
large_futures = "deny"
needless_pass_by_value = "deny"
trivially_copy_pass_by_ref = "deny"
cast_possible_truncation = "deny"
cast_possible_wrap = "deny"
cast_sign_loss = "deny"
cast_precision_loss = "deny"
cast_lossless = "deny"

[workspace.package]
version = "0.0.1"
edition = "2021"
authors = ["Anton Batenev <antonbatenev@yandex.ru>"]
license = "MIT"
repository = "https://github.com/abbat/dyapp"
rust-version = "1.99"

[workspace.dependencies]
prost = "0.14"
prost-build = "0.14"
protox = "0.10"
# Tests run in-process; no fork/timeout overrides are used (see docs/agents/project.md).
proptest = { version = "1.10", default-features = false, features = ["std", "bit-set"] }
proptest-derive = "0.9"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1

# Line tables keep backtraces readable at a fraction of the full debuginfo size.
[profile.dev]
opt-level = 0
debug = "line-tables-only"

[profile.test]
opt-level = 0
debug = 0

# Argon2 runs at release speed in debug and test builds: profile PoW tests hash thousands of times.
[profile.dev.package.argon2]
opt-level = 3
[profile.dev.package.blake2]
opt-level = 3
[profile.test.package.argon2]
opt-level = 3
[profile.test.package.blake2]
opt-level = 3
