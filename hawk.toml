# Audit the shipped daemon and the core consumed by foreign-language clients.
# Existing unused APIs are marked, never removed; new findings fail quality.
[[production]]
package = "dyapp-bootstrap"
bin = "dyappd"
reason = "shipped bootstrap node"

[[production]]
package = "dyapp-ffi"
lib = "dyapp_ffi"
reason = "core API consumed by the native clients"

# Real desktop consumers live in standalone Linux/Windows Cargo workspaces.
[[override]]
lint = "hawk::dead_public"
crate = "dyapp_client"
item = "session::Session::announce_presence"
kind = "inherent_method"
level = "expect"
reason = "Used by clients/desktop/chats/presence.rs outside this Cargo workspace."

[[override]]
lint = "hawk::dead_public"
crate = "dyapp_client"
item = "session::forward::<impl session::Session>::send_forwarded_text"
kind = "inherent_method"
level = "expect"
reason = "Called by the forwarding API used by the standalone desktop workspace."

