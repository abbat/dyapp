repos:
  - repo: local
    hooks:
      - id: fast-staged-checks
        name: Fast staged checks
        entry: python3 -B tests/scripts/check-fast-precommit.py
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit]
      - id: commit-message
        name: Commit message policy
        entry: python3 -B tests/scripts/check-repository.py --message-file
        language: system
        stages: [commit-msg]
      - id: commit-batch
        name: Staged commit size policy
        entry: python3 -B tests/scripts/check-batches.py --staged --message-file
        language: system
        stages: [commit-msg]
