repos:
  - repo: local
    hooks:
      - id: docker-quality
        name: Docker quality (read-only, full workspace)
        entry: bash tests/scripts/check-quality.sh
        language: system
        pass_filenames: false
        always_run: true
        require_serial: true
        stages: [pre-commit]
      - id: commit-message
        name: Commit message policy
        entry: python3 -B tests/scripts/check-repository.py --message-file
        language: system
        stages: [commit-msg]
      - id: commit-batch
        name: Staged commit size policy
        entry: python3 -B tests/scripts/check-batches.py --staged --message-file
        language: system
        stages: [commit-msg]
      - id: docker-test
        name: Docker full local inventory
        entry: bash tests/scripts/docker-test.sh all
        language: system
        pass_filenames: false
        always_run: true
        require_serial: true
        stages: [pre-push]
