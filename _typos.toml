# typos: spelling check of the source tree in the quality step.
[default.extend-words]
# Apple device identifier (simctl).
udid = "udid"
# hax-lib, the verification library under libcrux (deny.toml).
hax = "hax"
# GObject introspection packages (gir1.2-*) in the prototype image.
gir = "gir"
# WebP alpha chunk FourCC.
ALPH = "ALPH"

[files]
# Raw fuzz inputs and the embedded GeoNames places.
extend-exclude = ["tests/fuzz/corpus/", "rust/bootstrap/data/", "rust/client/data/"]
