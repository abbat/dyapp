# Practice B5: a failed test runs twice more; one that then passes is flaky
# (tests/scripts/check-flaky.py reads the JUnit report).

# One report path for every build: under cargo llvm-cov the target dir alone does not decide it.
[store]
dir = "build/nextest"

[profile.default]
retries = 2

[profile.default.junit]
path = "junit.xml"
