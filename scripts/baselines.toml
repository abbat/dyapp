# Ratchet baselines: a check fails when its metric gets worse than the value here.
# Tighten a value when the metric improves; loosening one weakens a check.

[coverage]
# Workspace line coverage, percent (scripts/check_coverage.py).
lines = 87.8

[batches]
# A4 adoption: only later commits are subject to the new rule.
base = "ddb52cbe7ba4ed114eb1cc8f8c053f6639c851f1"
max_lines = 400

[panics]
# B8: explicit Clippy panic/unwrap/expect sites, excluding test targets/generated code.
"dyapp-bootstrap" = 50
"dyapp-ffi" = 0
"dyapp-identity" = 1
"dyapp-messaging" = 4
"dyapp-p2p-net" = 4
"dyapp-profile" = 2
"dyapp-video" = 4

[public_docs]
# Staged B9: authored missing_docs sites; generated policy and global deny are planned.
"dyapp-bootstrap" = 151
"dyapp-ffi" = 0
"dyapp-identity" = 11
"dyapp-messaging" = 13
"dyapp-p2p-net" = 55
"dyapp-profile" = 12
"dyapp-video" = 18

[size]
# Practice B6: a source file has at most max_lines lines (scripts/check-repository.py).
max_lines = 1000

[size.files]
# Older files over the limit: each may shrink, never grow; lower its budget when it shrinks.
"rust/bootstrap/src/config.rs" = 1250
"rust/bootstrap/src/media_repair.rs" = 1008
"rust/bootstrap/src/node.rs" = 3752
"rust/bootstrap/src/search.rs" = 1280
"rust/bootstrap/src/service.rs" = 4400
"rust/bootstrap/tests/protocol.rs" = 1594
"rust/p2p-net/src/lib.rs" = 1599
