# Ratchet baselines: a check fails when its metric gets worse than the value here.
# Tighten a value when the metric improves; loosening one weakens a check.

[coverage]
# Workspace line coverage, percent (scripts/check_coverage.py).
lines = 87.8

[batches]
# A4 adoption: only later commits are subject to the new rule.
base = "ddb52cbe7ba4ed114eb1cc8f8c053f6639c851f1"
max_lines = 400

[batches.exceptions]
# Reasons for pushed commits that lack a Large-Change trailer; history is not rewritten.
c02b836c81146bdd82af6f4701ae179311ea3f33 = "Atomic missing_docs deny with the test extractions its size budgets required"
b665f8eb6103cfae36c96750ab1b7e62216ece23 = "Search puzzle module with its tests and wiring; 3 lines over"
57e927c8cd6ea510aa00ea4e082bca5c9d88b466 = "Atomic move of store requests off the swarm loop; node.rs reindented"
491a1d7a03ab0dd8e4ef3bb763ee21a580525e88 = "Heartbeat proof of work with the search module splits its size budgets required"

[panics]
# B8: explicit Clippy panic/unwrap/expect sites, excluding test targets/generated code.
"dyapp-bootstrap" = 50
"dyapp-ffi" = 0
"dyapp-identity" = 1
"dyapp-messaging" = 4
"dyapp-p2p-net" = 4
"dyapp-profile" = 2
"dyapp-video" = 4

[scorecard]
# Practice C3: OpenSSF Scorecard aggregate score (scripts/check-scorecard.py); the target is 7.0.
score = 6.8

[mutants]
# Practice B2: weekly full cargo-mutants score, percent (scripts/check-mutants.py); the first
# full run on 2026-10-19 caught 1582 and timed out 9 of 2205 viable mutants.
score = 72.2

[flaky]
# Practice B5: quarantined flaky tests (JUnit "classname name") and the date each was found;
# scripts/check-flaky.py fails on an unlisted flaky test and on an entry older than 7 days.

[size]
# Practice B6: a source file has at most max_lines lines (scripts/check-repository.py).
max_lines = 1000

[size.files]
# Older files over the limit: each may shrink, never grow; lower its budget when it shrinks.
"rust/bootstrap/src/node.rs" = 3651
"rust/bootstrap/src/service.rs" = 3462
"rust/bootstrap/tests/protocol.rs" = 1002
