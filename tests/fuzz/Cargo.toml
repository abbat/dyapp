[package]
name = "dyapp-fuzz"
version = "0.0.0"
edition = "2021"
publish = false
description = "cargo-fuzz targets for the request handlers of a bootstrap node (practice B4)"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4.13"
prost = "0.14"
dyapp-bootstrap = { path = "../../rust/bootstrap" }
dyapp-ffi = { path = "../../rust/ffi" }
dyapp-identity = { path = "../../rust/identity" }
dyapp-messaging = { path = "../../rust/messaging" }
dyapp-p2p-net = { path = "../../rust/p2p-net" }
dyapp-profile = { path = "../../rust/profile" }
dyapp-video = { path = "../../rust/video" }
# The SDP and ICE parsers behind dyapp-video's webrtc; keep in step with rust/video.
rtc = { version = "0.21", default-features = false }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
allow_attributes = "deny"
allow_attributes_without_reason = "deny"

# Its own workspace: libFuzzer builds only under cargo-fuzz.
[workspace]

[profile.release]
debug = 1

[[bin]]
name = "node"
path = "fuzz_targets/node.rs"
test = false
doc = false
bench = false

[[bin]]
name = "profile"
path = "fuzz_targets/profile.rs"
test = false
doc = false
bench = false

