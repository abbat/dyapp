[package]
name = "dyapp-fuzz"
version = "0.0.0"
edition = "2021"
publish = false
description = "cargo-fuzz targets for the request handlers of a bootstrap node (practice B4)"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4.13"
prost = "0.14"
dyapp-bootstrap = { path = "../../rust/bootstrap" }
dyapp-identity = { path = "../../rust/identity" }
dyapp-p2p-net = { path = "../../rust/p2p-net" }
dyapp-profile = { path = "../../rust/profile" }

[lints.rust]
unsafe_code = "forbid"

# Its own workspace: libFuzzer builds only under cargo-fuzz.
[workspace]

[profile.release]
debug = 1

[[bin]]
name = "node"
path = "fuzz_targets/node.rs"
test = false
doc = false
bench = false

[[bin]]
name = "profile"
path = "fuzz_targets/profile.rs"
test = false
doc = false
bench = false

[[bin]]
name = "mailbox"
path = "fuzz_targets/mailbox.rs"
test = false
doc = false
bench = false

[[bin]]
name = "media"
path = "fuzz_targets/media.rs"
test = false
doc = false
bench = false

[[bin]]
name = "search"
path = "fuzz_targets/search.rs"
test = false
doc = false
bench = false

[[bin]]
name = "inventory"
path = "fuzz_targets/inventory.rs"
test = false
doc = false
bench = false

[[bin]]
name = "digest"
path = "fuzz_targets/digest.rs"
test = false
doc = false
bench = false

[[bin]]
name = "gossip"
path = "fuzz_targets/gossip.rs"
test = false
doc = false
bench = false
