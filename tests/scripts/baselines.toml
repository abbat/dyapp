# Ratchet baselines: a check fails when its metric gets worse than the value here.
# Tighten a value when the metric improves; loosening one weakens a check.

[coverage]
# Workspace line coverage, percent (tests/scripts/check_coverage.py).
# 88.44 measured on 2026-10-23 after covering the media-get CLI; previously lowered
# from 87.8 to 86.0 when bootstrap's inline tests moved to separate test files.
lines = 88.4

[batches]
# Published-history cutoff. Moved on 2026-10-23 after c0cd328 (485 lines) reached main
# without a Large-Change trailer; no published history was rewritten.
base = "834083cda0db08f32aec6682289ba729ecaead74"
max_lines = 400

[panics]
# B8: explicit Clippy panic/unwrap/expect sites, excluding test targets/generated code.
"dyapp-bootstrap" = 48
"dyapp-client" = 0
"dyapp-ffi" = 0
"dyapp-identity" = 1
"dyapp-messaging" = 4
"dyapp-p2p-net" = 4
"dyapp-profile" = 2
"dyapp-video" = 3

[scorecard]
# Practice C3: OpenSSF Scorecard aggregate score (tests/scripts/check-scorecard.py); the target is 7.0.
# 7.1 measured on 2026-10-21 after the local linux-test image added an unpinned
# Dockerfile to Scorecard's Pinned-Dependencies count.
score = 7.1

[mutants]
# Practice B2: weekly full cargo-mutants score, percent (tests/scripts/check-mutants.py); the first
# full run on 2026-10-19 caught 1582 and timed out 9 of 2205 viable mutants.
score = 72.2

[mutants.invariants]
# Security invariants: every mutant here must be caught or time out, with no accepted survivors.
# Keys are files, values regexes searched in the mutated function's name ("" = every function).
"rust/identity/src/lib.rs" = "Identity::sign|SignedRecord::verify|signed_bytes|peer_id|key_hash|label"
"rust/profile/src/lib.rs" = "verify|accept|validate|check_newer|pow_leading_bits|heartbeat_pow_bits|argon_bits|stored_version|fields"
"rust/messaging/src/mls.rs" = "verify_member|verify_leaf|group_of|verify_key_package|join|process"
"rust/bootstrap/src/service.rs" = "node_peer|^Service::media$|store_shard|store_media|authorization"
"rust/bootstrap/src/service/media.rs" = "node_peer|^Service::media$|store_shard|store_media|authorization"
"rust/bootstrap/src/media.rs" = "node_peer|^Service::media$|store_shard|store_media|authorization"
"rust/bootstrap/src/media_repair.rs" = ""

[flaky]
# Practice B5: quarantined flaky tests (JUnit "classname name") and the date each was found;
# tests/scripts/check-flaky.py fails on an unlisted flaky test and on an entry older than 7 days.

[size]
# Practice B6: a source file has at most max_lines lines (tests/scripts/check-repository.py).
max_lines = 1000

[size.files]
# Files over the limit: each may shrink, never grow; lower its budget when it shrinks. None now.
