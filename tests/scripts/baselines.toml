# Ratchet baselines: a check fails when its metric gets worse than the value here.
# Tighten a value when the metric improves; loosening one weakens a check.

[coverage]
# Workspace line coverage, percent (tests/scripts/check_coverage.py).
# 88.44 measured on 2026-10-23 after covering the media-get CLI; previously lowered
# from 87.8 to 86.0 when bootstrap's inline tests moved to separate test files.
lines = 88.4

[batches]
# Published-history cutoff. Moved on 2026-10-23 after c0cd328 (485 lines) reached main
# without a Large-Change trailer; no published history was rewritten.
base = "834083cda0db08f32aec6682289ba729ecaead74"
max_lines = 400

[panics]
# B8: explicit Clippy panic/unwrap/expect sites, excluding test targets/generated code.
"dyapp-bootstrap" = 46
"dyapp-client" = 0
"dyapp-ffi" = 0
"dyapp-identity" = 1
"dyapp-messaging" = 3
"dyapp-p2p-net" = 4
"dyapp-profile" = 2
"dyapp-video" = 3

[scorecard]
# Practice C3: OpenSSF Scorecard aggregate score (tests/scripts/check-scorecard.py); the target is 7.0.
# 7.1 measured on 2026-10-21 after the local linux-test image added an unpinned
# Dockerfile to Scorecard's Pinned-Dependencies count.
score = 7.1

[mutants]
# Practice B2: weekly full cargo-mutants score, percent (tests/scripts/check-mutants.py); the first
# full run on 2026-10-19 caught 1582 and timed out 9 of 2205 viable mutants.
score = 72.2

[mutants.invariants]
# Security invariants: every mutant here must be caught or time out, with no accepted survivors.
# Keys are files, values regexes searched in the mutated function's name ("" = every function).
"rust/identity/src/lib.rs" = "Identity::sign|SignedRecord::verify|signed_bytes|peer_id|key_hash|label"
"rust/profile/src/lib.rs" = "verify|accept|validate|check_newer|pow_leading_bits|heartbeat_pow_bits|argon_bits|stored_version|fields"
"rust/messaging/src/mls.rs" = "verify_member|verify_leaf|group_of|verify_key_package|join|process"
"rust/bootstrap/src/service.rs" = "node_peer|^Service::media$|store_shard|store_media|authorization"
"rust/bootstrap/src/service/media.rs" = "node_peer|^Service::media$|store_shard|store_media|authorization"
"rust/bootstrap/src/media.rs" = "node_peer|^Service::media$|store_shard|store_media|authorization"
"rust/bootstrap/src/media_repair.rs" = ""

[flaky]
# Practice B5: quarantined flaky tests (JUnit "classname name") and the date each was found;
# tests/scripts/check-flaky.py fails on an unlisted flaky test and on an entry older than 7 days.
# The next three were renewed by the maintainer: macOS opened no window, so they stayed unproven there.
# iOS: the cancelled retry passed on the second iteration.
"NetworkDraftTests testCancelRetryKeepsPriorActiveNetwork()" = 2026-11-12
# iOS: the local-node check showed no row outcome within 30 s; the retry passed.
"LaunchTests testLocalNodeConnectsOnlyAfterContinue()" = 2026-11-12
"LaunchTests testCancelRetryAndRestartKeepDraft()" = 2026-11-12
# Android: publishing showed no status and no error within 120 s, twice in one process; the retries passed.
"com.dyapp.ProfileRemovalTests removalWithdrawsThePublishedProfileAndWaitsForANode" = 2026-11-12
"com.dyapp.ProfileRemovalTests removeAnywayRemovesWithoutANode" = 2026-11-12
# Android: after Save the network status kept the draft hint instead of the saved notice; the retry passed.
"com.dyapp.NetworkDraftTests savedDraftSurvivesRestartAndFailedRowsBlockContinue" = 2026-11-13
# Android: Settings opened without the active-key row in Russian; the retry passed.
"com.dyapp.PseudoLocaleTests settingsRenderRussianStrings" = 2026-11-13
# Android: after the tap the read receipt switch did not show On within 5 s; the retry passed.
"com.dyapp.ReadReceiptsTests theReadReceiptSwitchIsOffByDefaultAndStored" = 2026-11-12
# iOS: the local-node check showed no row outcome within 30 s; the retry passed.
"ChatsUITests testPeerRequestRepliesEditsClearsAndBlocks()" = 2026-11-12
# iOS: the tap on the age field gave it no keyboard focus; the retry passed.
"ProfileUITests testTypedFieldsRefuseBadHeightAndSurviveRestart()" = 2026-11-12
# macOS: the profile form stayed disabled with its read error; the retry passed.
"ChatsUITests testFullPhotoLoadsWithoutATapOnAnUnmeteredNetwork()" = 2026-11-12
# iOS: failed once with the cause not read yet; the retry passed.
"LaunchTests testWrongNetworkDisablesContinue()" = 2026-11-12
# iOS: the tap on Save right after typing did nothing, the keyboard still up; the retry passed.
"ProfileUITests testPlacePickerSavesOnlyASuggestedPlace()" = 2026-11-12
# iOS: a filter under the navigation bar took no focus on its tap; the retry passed.
"SearchUITests testSampleOffersFiltersThatRefuseBadRanges()" = 2026-11-12
# iOS: the tap on a just shown liked row opened nothing, the row in plain view; the retry passed.
"ChatsUITests testLikeBackFromLikedYouMatchesAndMessageOpensTheChat()" = 2026-11-12
# iOS: after Save the adult confirmation stayed disabled for 10 s; the retry passed. Clean on macOS.
"ProfileUITests testProfileDraftRestartFailedPublishAndSignedReadback()" = 2026-11-06
# iOS: the create button had no hit point on its reveal, its frame unusable; the retry passed.
"LaunchTests testSettingsRemoveCancelThenSelectSurvivorAfterConfirm()" = 2026-11-06

[size]
# Practice B6: a source file has at most max_lines lines (tests/scripts/check-repository.py).
max_lines = 1000

[size.files]
# Files over the limit may shrink, never grow; lower each budget when it shrinks.

[settings]
# Criteria S5 (an immediate binary setting is a switch) and S2 (no list that grows with use) in
# docs/design/review-criteria.md: checkboxes and list rows (tr, li, .list-item) inside each
# prototype's settings section, counted by tests/scripts/check-repository.py. A count may only
# fall, and the budget falls with it. The target is no checkboxes and only the hub's category
# rows; a hub that needs more rows raises the budget in its own reviewed change.
desktop = { checkboxes = 0, rows = 0 }
android = { checkboxes = 5, rows = 4 }

[layout]
