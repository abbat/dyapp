name: dyapp

# Reports go to host directories under build/, written as the host user.
x-runtime: &runtime
  user: "${DYAPP_UID:-1000}:${DYAPP_GID:-1000}"
  cpus: ${DYAPP_CPUS:-4}
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  read_only: true
  tmpfs:
    - /tmp:rw,exec,nosuid,nodev,mode=1777
    - /home/appuser:rw,nosuid,nodev,uid=${DYAPP_UID:-1000},gid=${DYAPP_GID:-1000},mode=0700

# The Android image holds its Gradle build and cache as 1000, so its services stay 1000.
x-android: &android
  <<: *runtime
  user: "1000:1000"
  tmpfs:
    - /tmp:rw,exec,nosuid,nodev,mode=1777
    - /home/appuser:rw,nosuid,nodev,uid=1000,gid=1000,mode=0700
  volumes:
    - ../../build/android-reports:/reports

services:
  android-emulator:
    <<: *android
    cpus: ${DYAPP_EMULATOR_CPUS:-3}
    build:
      context: ../..
      dockerfile: tests/docker/Dockerfile.android-test
    image: dyapp:android-test
    profiles: [android-emulator, all]
    networks: [android-ui]
    # The emulator demands 1.2 x the 6G userdata partition free (the minimum it enforces);
    # /tmp is a RAM tmpfs, so the sparse AVD lives on disk.
    volumes:
      - ../../build/android-reports:/reports
      - ../../build/android-avd:/avd
    environment:
      HOME: /home/appuser
      ANDROID_SDK_ROOT: /opt/android-sdk
    command: [bash, /app/tests/scripts/android-test-in-container.sh, emulator]
    healthcheck:
      test: [CMD-SHELL, 'test "$$(adb -s emulator-5554 shell getprop sys.boot_completed 2>/dev/null | tr -d "\\r")" = 1 && adb -s emulator-5554 shell cmd package path android >/dev/null']
      interval: 15s
      timeout: 60s
      retries: 120
      start_period: 30s

  android-unit-test:
    <<: *android
    build:
      context: ../..
      dockerfile: tests/docker/Dockerfile.android-test
    image: dyapp:android-test
    profiles: [android, test, all]
    network_mode: none
    environment:
      HOME: /home/appuser
      GRADLE_USER_HOME: /opt/gradle-cache
      ANDROID_SDK_ROOT: /opt/android-sdk
    command: [bash, /app/tests/scripts/android-test-in-container.sh, unit]

  android-emulator-test:
    <<: *android
    cpus: 1
    build:
      context: ../..
      dockerfile: tests/docker/Dockerfile.android-test
    image: dyapp:android-test
    profiles: [android-emulator, all]
    networks: [android-ui]
    depends_on:
      android-emulator:
        condition: service_healthy
    environment:
      ADB_SERVER_SOCKET: tcp:android-emulator:5037
      HOME: /home/appuser
      GRADLE_USER_HOME: /opt/gradle-cache
      ANDROID_SDK_ROOT: /opt/android-sdk
    command: [bash, /app/tests/scripts/android-test-in-container.sh, ui]

  linux-test:
    <<: *runtime
    build:
      context: ../..
      dockerfile: tests/docker/Dockerfile.linux-test
    image: dyapp:linux-test
    profiles: [linux, test, all]
    network_mode: none
    volumes:
      - ../../build/linux-reports:/reports
      # The checkout builds into build/linux as the host user, so the image holds no build output.
      - ../..:/app:ro
      - ../../build/linux:/app/build
      - ../../build/ux-research/current:/shots
    environment:
      HOME: /tmp
      DYAPP_UI_SHOTS: /shots
    command: [bash, -c, "bash /app/tests/scripts/check-container-isolation.sh && exec bash /app/tests/scripts/linux-test.sh"]

  prototype-shots:
    <<: *runtime
    build:
      context: ../..
      dockerfile: tests/docker/Dockerfile.prototype
    image: dyapp:prototype
    profiles: [prototype, all]
    network_mode: none
    volumes:
      - ../../clients/desktop:/desktop:ro
      - ../../build/ux-research/prototype:/shots
      # Mounted so a changed screen list needs no image rebuild.
      - ../../tests/scripts/prototype-shots.py:/app/prototype-shots.py:ro
    environment:
      HOME: /home/appuser
    command: [xvfb-run, -a, -s, "-screen 0 1280x800x24", python3, /app/prototype-shots.py]

  # The Android prototype loads the desktop strings through ../../desktop, so both are mounted.
  prototype-shots-android:
    <<: *runtime
    image: dyapp:prototype
    profiles: [prototype, all]
    network_mode: none
    environment:
      HOME: /home/appuser
    volumes:
      - ../../clients/desktop:/desktop:ro
      - ../../clients/android/prototype:/android/prototype:ro
      - ../../build/ux-research/prototype-android:/shots
      - ../../tests/scripts/prototype-shots.py:/app/prototype-shots.py:ro
    command: [xvfb-run, -a, -s, "-screen 0 1280x800x24", python3, /app/prototype-shots.py, android]

networks:
  android-ui:
    internal: true
